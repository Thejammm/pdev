<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropDev — Developer Appraisal</title>
<style>
  :root{
    --ink:#1c2433;--muted:#7a8290;--faint:#aab2bf;--line:#eceef3;--bg:#f4f6fa;--card:#fff;
    --navy:#1f3864;--navy2:#33589a;--accent:#2e5ba8;
    --green:#1f7a52;--greenbg:#eaf5ee;--red:#b23b3b;--redbg:#fbeceb;--amber:#8a5d00;--amberbg:#fdf4de;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
    background:var(--bg);font-size:15px;line-height:1.5;padding-bottom:60px}
  .wrap{max-width:760px;margin:0 auto}
  .appbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;
    align-items:center;justify-content:space-between;gap:10px}
  .appbar .ttl{font-size:15px;font-weight:700;letter-spacing:.2px}
  .appbar .ttl span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:1px}
  .menu{position:relative}
  .ic{background:none;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
  .menu-pop{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(20,30,50,.16);min-width:190px;overflow:hidden;display:none;z-index:60}
  .menu-pop.open{display:block}
  .menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:12px 15px;font-size:14px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
  .menu-pop button:last-child{border-bottom:none}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px 4px}
  select.deals{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink);background:#fff;max-width:190px}
  .mini{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .seg{display:inline-flex;background:#e7ebf2;border-radius:10px;padding:3px;margin-left:auto}
  .seg button{border:none;background:none;padding:7px 13px;font-size:13px;font-weight:700;color:#67707f;border-radius:8px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,30,50,.12)}
  .stick{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 16px 0;border-bottom:1px solid var(--line)}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .summary .top{display:flex;justify-content:space-between;align-items:flex-start}
  .summary .lab{font-size:12px;color:var(--muted);font-weight:600}
  .summary .big{font-size:27px;font-weight:800;letter-spacing:-.6px;margin:2px 0 0}
  .summary .big.pos{color:var(--green)} .summary .big.neg{color:var(--red)}
  .pill{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap}
  .pill.green{background:var(--greenbg);color:var(--green)} .pill.amber{background:var(--amberbg);color:var(--amber)} .pill.red{background:var(--redbg);color:var(--red)}
  .summary .mini{font-size:12.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  .summary .mini b{color:var(--ink);font-weight:700}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:11px 0 9px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;flex:none}
  .tabs button.on{background:var(--navy);color:#fff}
  .tabc{padding:14px 16px 24px}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 15px;margin-bottom:12px}
  .grp h3{font-size:13.5px;font-weight:700;margin:13px 2px 5px;letter-spacing:.1px}
  .fld{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .fld:last-of-type{border-bottom:none}
  .fld .l{font-size:14px;color:var(--ink)}
  .fld .l .q{display:inline-flex;width:15px;height:15px;border-radius:50%;background:#eef1f6;color:#8792a2;font-size:10px;font-weight:800;align-items:center;justify-content:center;cursor:help;margin-left:5px;vertical-align:middle}
  .inp{width:128px;text-align:right;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;font-variant-numeric:tabular-nums;background:#fbfcfe;color:var(--navy);font-weight:700}
  .inp:focus{outline:none;border-color:var(--navy2);background:#fff}
  .inp.txt{width:190px;text-align:left;color:var(--ink);font-weight:600}
  select.inp{width:auto;min-width:128px;font-weight:700}
  .affix{display:flex;align-items:center;gap:4px}
  .u{font-size:12px;color:var(--muted);font-weight:700}
  .det-tog{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:11px 2px 9px}
  .det-tog .cx{transition:transform .15s;font-weight:800}
  .det-tog.open .cx{transform:rotate(90deg)}
  .det{display:none;background:#f7f9fc;border:1px dashed var(--line);border-radius:11px;padding:4px 13px;margin:0 0 10px}
  .det.open{display:block}
  .o{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eef1f6;font-size:13.5px}
  .o:last-child{border-bottom:none}
  .o .v{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .o .v.pos{color:var(--green)} .o .v.neg{color:var(--red)}
  .o.big{padding:9px 0} .o.big .v{font-size:16px}
  textarea.notes{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;background:#fbfcfe;margin:6px 0 10px;font-family:inherit;resize:vertical;min-height:44px}
  .score{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
  .ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none}
  .score .t b{display:block;font-size:16px} .score .t{font-size:13px;color:var(--muted)}
  .hbs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .hb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center}
  .hb .k{font-size:13px;font-weight:600} .hb .p{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
  .p.green{background:var(--greenbg);color:var(--green)} .p.amber{background:var(--amberbg);color:var(--amber)} .p.red{background:var(--redbg);color:var(--red)}
  .kv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 15px;margin-bottom:12px}
  .slider{padding:9px 2px;border-bottom:1px solid var(--line)}
  .slider .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
  .slider .t .val{color:var(--accent);font-weight:800}
  .slider input[type=range]{width:100%;margin-top:7px;accent-color:var(--navy2)}
  .stressgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
  .stress{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left}
  .stress.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl td{padding:7px 2px;border-bottom:1px solid var(--line)}
  .tbl td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .tbl tr.tot td{border-top:2px solid var(--navy);font-weight:800;color:var(--navy);border-bottom:none;padding-top:8px}
  .hint{font-size:12px;color:var(--muted);margin:2px 2px 10px;line-height:1.5}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:800;margin:16px 2px 8px}
  .note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:12px;line-height:1.5}
  .pdfbtn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="ttl">PropDev · Appraisal<span id="sub">Feasibility &amp; risk</span></div>
    <div class="menu">
      <button class="ic" onclick="toggleMenu(event)">···</button>
      <div class="menu-pop" id="menuPop">
        <button onclick="exportPDF()">Export appraisal (PDF)</button>
        <button onclick="exportJSON()">Download backup</button>
        <button onclick="document.getElementById('imp').click()">Restore backup</button>
      </div>
      <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
  <div class="controls">
    <select class="deals" id="dealSel" onchange="switchDeal(this.value)"></select>
    <button class="mini" onclick="newDeal()">＋ New</button>
    <button class="mini" onclick="renameDeal()">Rename</button>
    <button class="mini" onclick="delDeal()">Delete</button>
    <div class="seg" id="modeSeg">
      <button data-m="flip" onclick="setMode('flip')">Flip</button>
      <button data-m="btl" onclick="setMode('btl')">Buy to Let</button>
    </div>
  </div>
  <div class="stick">
    <div class="summary" id="summary"></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="tabc" id="tabc"></div>
</div>

<script>
var MEM={};var HAS_LS=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
function lsGet(k){try{return HAS_LS?localStorage.getItem(k):MEM[k];}catch(e){return MEM[k];}}
function lsSet(k,v){try{if(HAS_LS)localStorage.setItem(k,v);else MEM[k]=v;}catch(e){MEM[k]=v;}}
var KEY='pdevPro_v1';var store={deals:[],current:null};
function load(){var r=lsGet(KEY);if(r){try{store=JSON.parse(r);}catch(e){}}if(!store.deals)store.deals=[];
  if(!store.deals.length){var d=defDeal();store.deals.push(d);store.current=d.id;}
  if(!store.current||!store.deals.find(x=>x.id===store.current))store.current=store.deals[0].id;}
function save(){lsSet(KEY,JSON.stringify(store));}
function deal(){return store.deals.find(x=>x.id===store.current);}
function uid(){return 'd'+Date.now()+Math.floor(Math.random()*1000);}
function num(v){if(typeof v==='string')v=v.replace(/[£,\s]/g,'');var x=parseFloat(v);return isNaN(x)?0:x;}
function money(n){if(n===Infinity)return '∞';if(isNaN(n)||n==null)return '—';var s=Math.round(Math.abs(n)).toLocaleString('en-GB');return (n<0?'−£':'£')+s;}
function pct(n){if(isNaN(n)||!isFinite(n))return '—';return (n*100).toFixed(1)+'%';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function today(){var d=new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function sdlt(p){var b=[[0,125000,.05],[125000,250000,.07],[250000,925000,.10],[925000,1500000,.15],[1500000,1e12,.17]];var t=0;for(var i=0;i<b.length;i++)t+=Math.max(0,Math.min(p,b[i][1])-b[i][0])*b[i][2];return t;}
function amortPay(P,r,n){if(P<=0)return 0;if(r<=0)return P/n;return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);}
function amortBal(P,r,n,a){if(P<=0)return 0;if(r<=0)return Math.max(0,P-(P/n)*a);var pay=amortPay(P,r,n),bal=P;for(var i=0;i<a&&i<n;i++)bal=bal*(1+r)-pay;return Math.max(0,bal);}
function defDeal(){return{id:uid(),name:'New appraisal',mode:'flip',
  address:'',purchasePrice:200000,offerPrice:190000,marketValue:220000,gdv:275000,monthlyRent:1250,
  propertyType:'Terraced house',floorArea:90,bedrooms:3,bathrooms:1,
  mortgageType:'bridging',mortgageBasis:'interest',depositPct:25,interestRate:9,termYears:1,
  arrangeFeePct:2,brokerFee:1500,valuationFee:500,refiLTV:75,
  solicitorAcq:1500,searches:350,survey:600,landRegistry:150,mortgageFeesAcq:0,otherAcq:0,
  r_kitchen:0,r_bathroom:0,r_electrical:0,r_plumbing:0,r_heating:0,r_roof:0,r_windows:0,
  r_decoration:0,r_flooring:0,r_external:0,r_garden:0,r_waste:0,r_professional:0,contingencyPct:10,
  h_insurance:30,h_utilities:80,h_councilTax:120,h_security:0,h_storage:0,h_site:0,h_other:0,projectMonths:6,
  agentPct:1.5,sellSolicitor:1200,epc:100,marketing:300,staging:0,sellOther:0,
  managementPct:10,maintenancePct:5,rentInsurance:200,gasSafety:80,electricalInspection:150,
  licensing:0,voidPct:5,groundRent:0,serviceCharge:0,rentOther:0,
  targetProfit:30000,targetYield:8,notes:{}};}
function calc(d,ov){ov=ov||{};
  var pp=num(d.purchasePrice)*(ov.ppMult||1),gdv=num(d.gdv)*(ov.gdvMult||1),rate=num(d.interestRate)+(ov.rateDelta||0);
  var rentM=num(d.monthlyRent)*(ov.rentMult||1),months=Math.max(0,num(d.projectMonths)+(ov.monthsDelta||0));
  var isBtl=d.mode==='btl',isCash=d.mortgageType==='cash';
  var rBase=num(d.r_kitchen)+num(d.r_bathroom)+num(d.r_electrical)+num(d.r_plumbing)+num(d.r_heating)+num(d.r_roof)+num(d.r_windows)+num(d.r_decoration)+num(d.r_flooring)+num(d.r_external)+num(d.r_garden)+num(d.r_waste)+num(d.r_professional);
  var contingency=rBase*num(d.contingencyPct)/100,refurb=(rBase+contingency)*(ov.refurbMult||1);
  var deposit=isCash?pp:pp*num(d.depositPct)/100,mortgage=isCash?0:Math.max(0,pp-deposit),ltv=pp>0?mortgage/pp:0;
  var arrange=mortgage*num(d.arrangeFeePct)/100,financeFees=arrange+num(d.brokerFee)+num(d.valuationFee),mrate=rate/100/12,monthlyPay,financeInterest;
  if(isCash){monthlyPay=0;financeInterest=0;}
  else if(d.mortgageBasis==='repayment'){var n=Math.max(1,num(d.termYears)*12);monthlyPay=amortPay(mortgage,mrate,n);var bal=amortBal(mortgage,mrate,n,Math.min(months,n));financeInterest=monthlyPay*Math.min(months,n)-(mortgage-bal);}
  else{monthlyPay=mortgage*mrate;financeInterest=monthlyPay*months;}
  var financeCosts=financeFees+financeInterest,stamp=sdlt(pp);
  var acqTotal=stamp+num(d.solicitorAcq)+num(d.searches)+num(d.survey)+num(d.landRegistry)+num(d.mortgageFeesAcq)+num(d.otherAcq);
  var holdMoNonMort=num(d.h_insurance)+num(d.h_utilities)+num(d.h_councilTax)+num(d.h_security)+num(d.h_storage)+num(d.h_site)+num(d.h_other);
  var holdTotNonMort=holdMoNonMort*months,holdMoIncl=holdMoNonMort+monthlyPay,holdTotIncl=holdMoIncl*months;
  var sellFixed=num(d.sellSolicitor)+num(d.epc)+num(d.marketing)+num(d.staging)+num(d.sellOther),sellAgent=gdv*num(d.agentPct)/100,sellTotal=sellAgent+sellFixed;
  var cashBeforeRefurb=deposit+acqTotal+financeFees,cashInvested=deposit+acqTotal+financeFees+refurb+holdTotNonMort;
  var projectCost=pp+acqTotal+refurb+financeCosts+holdTotNonMort+sellTotal,profit=gdv-projectCost;
  var roi=cashInvested>0?profit/cashInvested:0,roce=projectCost>0?profit/projectCost:0,margin=gdv>0?profit/gdv:0,profitPM=months>0?profit/months:profit;
  var breakEven=(num(d.agentPct)<100)?(pp+acqTotal+refurb+financeCosts+holdTotNonMort+sellFixed)/(1-num(d.agentPct)/100):Infinity;
  var mao=gdv-num(d.targetProfit)-refurb-sellTotal-holdTotNonMort-financeCosts-acqTotal;
  var opMonthly=rentM*(num(d.managementPct)+num(d.maintenancePct)+num(d.voidPct))/100+(num(d.rentInsurance)+num(d.gasSafety)+num(d.electricalInspection)+num(d.licensing)+num(d.groundRent)+num(d.serviceCharge)+num(d.rentOther))/12;
  var netCF=rentM-monthlyPay-opMonthly,annualCF=netCF*12,grossYield=pp>0?rentM*12/pp:0,noiAnnual=rentM*12-opMonthly*12,netYield=(pp+acqTotal+refurb)>0?noiAnnual/(pp+acqTotal+refurb):0,coc=cashInvested>0?annualCF/cashInvested:0;
  var newLoan=gdv*num(d.refiLTV)/100,refiRelease=Math.max(0,newLoan-mortgage),capitalLeftIn=Math.max(0,cashInvested-refiRelease),cocLeftIn=capitalLeftIn>0?annualCF/capitalLeftIn:(annualCF>0?Infinity:0),equityBtl=gdv-newLoan,maoBtl=num(d.targetYield)>0?rentM*12/(num(d.targetYield)/100):0;
  var equity=isBtl?equityBtl:profit,maoU=isBtl?maoBtl:mao,discount=num(d.marketValue)>0?(num(d.marketValue)-pp)/num(d.marketValue):0;
  var totalProjectCost=isBtl?(pp+acqTotal+refurb+financeCosts+holdTotNonMort):projectCost;
  return{pp,gdv,rentM,months,isBtl,isCash,deposit,mortgage,ltv,arrange,financeFees,monthlyPay,financeInterest,financeCosts,stamp,acqTotal,rBase,contingency,refurb,holdMoNonMort,holdTotNonMort,holdMoIncl,holdTotIncl,sellAgent,sellFixed,sellTotal,cashBeforeRefurb,cashInvested,projectCost,totalProjectCost,profit,roi,roce,margin,profitPM,breakEven,mao:maoU,opMonthly,netCF,annualCF,grossYield,netYield,coc,newLoan,refiRelease,capitalLeftIn,cocLeftIn,equity,discount,ppm2:num(d.floorArea)>0?pp/num(d.floorArea):0,gdvm2:num(d.floorArea)>0?gdv/num(d.floorArea):0,refurbm2:num(d.floorArea)>0?refurb/num(d.floorArea):0,refurbPctPP:pp>0?refurb/pp:0};
}
function F(k,label,type,unit,tip,cls){return{k,label,type:type||'money',unit:unit||'£',tip:tip||'',adj:cls?cls[0]:'',cert:cls?cls[1]:'',risk:cls?cls[2]:'',ctrl:cls?cls[3]:null};}
var TYPES=['Terraced house','Semi-detached','Detached','Flat','Bungalow','HMO','Commercial'];
var GROUPS=[
 {id:'purchase',tab:'purchase',t:'Property & price',modes:'both',fields:[
   F('address','Property address','text','',''),
   F('purchasePrice','Purchase price','money','£','What you actually pay for the property.',['Yes','Variable','High',true]),
   F('offerPrice','Offer price','money','£','Compare this with the max offer in the summary.',['Yes','Variable','Medium',true]),
   F('marketValue','Market value (as-is)','money','£','Current value before works.',['No','Estimated','Medium',false]),
   F('gdv','End value / GDV','money','£','Resale price (flip) or valuation for refinance (BTL).',['No','Estimated','High',false]),
   F('monthlyRent','Monthly rent','money','£','Achievable rent once done up.',['No','Estimated','Medium',false]),
   F('propertyType','Property type','select','',''),
   F('floorArea','Floor area','num','m²','Drives the £/m² figures.',['No','Estimated','Low']),
   F('bedrooms','Bedrooms','num','',''),F('bathrooms','Bathrooms','num','','')]},
 {id:'finance',tab:'finance',t:'Finance',modes:'both',fields:[
   F('mortgageType','Mortgage type','select','','BTL, short-term Bridging, or Cash.',['Yes','Fixed','Medium',true]),
   F('mortgageBasis','Basis','select','','Interest-only keeps payments low; Repayment pays down the loan.',['Yes','Fixed','Low',true]),
   F('depositPct','Deposit','pctdep','%','Your cash deposit — % and £ stay linked.',['Yes','Variable','Medium',true]),
   F('interestRate','Interest rate','num','%','Annual rate. Bridging is quoted per month — enter the annual equivalent.',['No','Variable','High',false]),
   F('termYears','Term','num','yrs','Loan term in years (for repayment amortisation).',['Yes','Fixed','Low',true]),
   F('arrangeFeePct','Arrangement fee','num','%','% of the loan.',['No','Fixed','Low',false]),
   F('brokerFee','Broker fee','money','£','',['Yes','Fixed','Low',true]),
   F('valuationFee','Valuation fee','money','£','',['No','Fixed','Low',false]),
   F('refiLTV','Refinance LTV','num','%','BTL only — new loan as % of GDV when you refinance.',['Yes','Estimated','Medium',true])]},
 {id:'rental',tab:'finance',t:'Rental income & costs',modes:'btl',fields:[
   F('managementPct','Management','num','%','Letting agent fee as % of rent.',['Yes','Fixed','Low',true]),
   F('maintenancePct','Maintenance','num','%','Repairs allowance as % of rent.',['Yes','Estimated','Medium',true]),
   F('voidPct','Void allowance','num','%','Expected empty periods as % of rent.',['No','Estimated','Medium',false]),
   F('rentInsurance','Insurance (yr)','money','£','',['Yes','Fixed','Low',true]),
   F('gasSafety','Gas safety (yr)','money','£','',['No','Fixed','Low',false]),
   F('electricalInspection','Electrical (yr)','money','£','EICR, annualised.',['No','Fixed','Low',false]),
   F('licensing','Licensing (yr)','money','£','HMO / selective licence.',['No','Fixed','Medium',false]),
   F('groundRent','Ground rent (yr)','money','£','',['No','Fixed','Low',false]),

function detFor(id,c){
  if(id==='purchase')return O('Discount below market value',pct(c.discount),c.discount>=0?'pos':'neg')+O('£/m² purchase',money(c.ppm2))+O('£/m² end value',money(c.gdvm2));
  if(id==='finance')return O('Mortgage amount',money(c.mortgage))+O('Loan to value',pct(c.ltv))+O('Monthly payment',money(c.monthlyPay))+O('Interest over project',money(c.financeInterest))+O('Total finance costs',money(c.financeCosts),'',true);
  if(id==='rental')return O('Net cash flow / mo',money(c.netCF),c.netCF>=0?'pos':'neg',true)+O('Annual cash flow',money(c.annualCF),c.annualCF>=0?'pos':'neg')+O('Gross yield',pct(c.grossYield))+O('Net yield',pct(c.netYield))+O('Operating costs / mo',money(c.opMonthly));
  if(id==='acq')return O('Stamp Duty (auto)',money(c.stamp))+O('Total acquisition',money(c.acqTotal),'',true)+O('Cash before refurb',money(c.cashBeforeRefurb));
  if(id==='refurb')return O('Subtotal',money(c.rBase))+O('Contingency',money(c.contingency))+O('Total refurbishment',money(c.refurb),'',true)+O('Cost per m²',money(c.refurbm2))+O('% of purchase price',pct(c.refurbPctPP));
  if(id==='holding')return O('Monthly (incl. mortgage)',money(c.holdMoIncl))+O('Total (incl. mortgage)',money(c.holdTotIncl),'',true)+O('Excl. mortgage',money(c.holdTotNonMort));
  if(id==='selling')return O('Agent fee',money(c.sellAgent))+O('Total selling costs',money(c.sellTotal),'',true);
  return '';
}
function healthScores(c){var isB=c.isBtl;function W(v){return v>=70?'Excellent':v>=45?'Fair':'Poor';}function B(v){return v>=70?'green':v>=45?'amber':'red';}
  var purchase=c.discount>=0.1?90:c.discount>=0.03?60:c.discount>=0?40:15;
  var finance=(c.gdv>0)?(c.financeCosts/c.gdv<0.06?90:c.financeCosts/c.gdv<0.1?60:c.financeCosts/c.gdv<0.15?40:15):50;
  var cashflow=isB?(c.netCF>=250?90:c.netCF>=100?65:c.netCF>=0?40:10):(c.profitPM>=4000?90:c.profitPM>=1500?60:c.profitPM>=0?35:10);
  var roiS=isB?(c.coc>=0.09?90:c.coc>=0.06?60:c.coc>=0?35:10):(c.roi>=0.25?90:c.roi>=0.15?60:c.roi>=0.05?40:10);
  var profitS=isB?(c.equity>=40000?90:c.equity>=15000?60:c.equity>=0?35:10):(c.profit>=30000?90:c.profit>=15000?60:c.profit>=0?35:5);
  var items=[['Purchase price',purchase],['Finance',finance],['Cash flow',cashflow],['ROI',roiS],['Profit',profitS]].map(x=>({k:x[0],word:W(x[1]),band:B(x[1])}));
  return{items,overall:Math.round(purchase*0.15+finance*0.15+cashflow*0.2+roiS*0.25+profitS*0.25)};
}
function summaryTab(c,d){var isB=c.isBtl,s=healthScores(c),col=s.overall>=70?'green':s.overall>=45?'amber':'red';
  var cv={green:'var(--greenbg)',amber:'var(--amberbg)',red:'var(--redbg)'}[col],cf={green:'var(--green)',amber:'var(--amber)',red:'var(--red)'}[col];
  var h='<div class="score"><div class="ring" style="background:'+cv+';color:'+cf+'">'+s.overall+'</div><div class="t">Overall deal score<b>'+(s.overall>=70?'Strong deal':s.overall>=45?'Marginal — negotiate':'Poor — re-cut or walk')+'</b></div></div>';
  h+='<div class="hbs">'+s.items.map(it=>'<div class="hb"><span class="k">'+it.k+'</span><span class="p '+it.band+'">'+it.word+'</span></div>').join('')+'</div>';
  h+='<h2 class="sec">Where the money goes</h2><div class="kv">'+O('Purchase price',money(c.pp))+O('Acquisition',money(c.acqTotal))+O('Refurbishment',money(c.refurb))+O('Finance',money(c.financeCosts))+O('Holding',money(c.holdTotNonMort))+(isB?'':O('Selling',money(c.sellTotal)))+O('Total project cost',money(c.totalProjectCost),'',true)+'</div>';
  h+='<h2 class="sec">Returns</h2><div class="kv">'+(isB?O('Annual cash flow',money(c.annualCF),c.annualCF>=0?'pos':'neg',true)+O('Cash-on-cash',pct(c.coc))+O('Gross / net yield',pct(c.grossYield)+' / '+pct(c.netYield))+O('Equity created',money(c.equity))+O('Capital left in',money(c.capitalLeftIn))+O('Return on cash left in',pct(c.cocLeftIn)):O('Expected profit',money(c.profit),c.profit>=0?'pos':'neg',true)+O('ROI',pct(c.roi))+O('ROCE',pct(c.roce))+O('Profit / month',money(c.profitPM))+O('Profit margin (on GDV)',pct(c.margin))+O('Break-even sale',money(c.breakEven)))+O('Total cash needed',money(c.cashInvested))+'</div>';
  h+='<h2 class="sec">Maximum offer</h2><div class="kv"><div class="hint">The most you should offer to still hit your target '+(isB?'yield.':'profit.')+'</div>'+O('Maximum offer price',money(c.mao),'',true)+
    '<div class="fld"><div class="l">Target '+(isB?'gross yield':'profit')+'</div><div class="affix">'+(isB?'':'<span class="u">£</span>')+'<input class="inp" style="width:100px" inputmode="decimal" value="'+esc(isB?d.targetYield:d.targetProfit)+'" oninput="upd(\''+(isB?'targetYield':'targetProfit')+'\',this.value)">'+(isB?'<span class="u">%</span>':'')+'</div></div></div>';
  return h;
}
var sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0},stressOn=null;

function paintRisk(d){

function onSlider(k,v){sens[k]=parseFloat(v);stressOn=null;var s=SLIDERS.find(x=>x[0]===k);
  var disp=s[2]==='mult'?(Math.round((sens[k]-1)*100)+'%'):s[2]==='pp'?((sens[k]>=0?'+':'')+sens[k]+'pp'):((sens[k]>=0?'+':'')+sens[k]+' mo');

function applyStress(i){if(stressOn===i){resetSens();return;}stressOn=i;sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0};Object.assign(sens,STRESS[i][1]);paintRisk(deal());repaint();}

function paintSensOut(d){var el=document.getElementById('sensOut');if(!el)return;var base=calc(d),sc=calc(d,sens),isB=base.isBtl;
  function dl(a,b,m){var diff=b-a;return '<span style="color:var(--faint);font-weight:600">('+(diff>=0?'+':'−')+(m?money(Math.abs(diff)).replace('−',''):pct(Math.abs(diff)))+')</span>';}
  var pf=isB?sc.annualCF:sc.profit,pf0=isB?base.annualCF:base.profit,rv=isB?sc.coc:sc.roi,rv0=isB?base.coc:base.roi,cfv=isB?sc.netCF:sc.profitPM;
  var sco=healthScores(sc).overall,tl=sco>=70?'green':sco>=45?'amber':'red';
  el.innerHTML=O(isB?'Annual cash flow':'Profit',money(pf)+' '+dl(pf0,pf,true),pf>=0?'pos':'neg',true)+O(isB?'Cash-on-cash':'ROI',pct(rv)+' '+dl(rv0,rv,false))+O('Monthly cash flow',money(cfv),cfv>=0?'pos':'neg')+O('Equity',money(isB?sc.equity:sc.profit))+'<div class="o big"><span>Scenario verdict</span><span class="p '+tl+'">'+(tl==='green'?'Strong':tl==='amber'?'Marginal':'Poor')+' · '+sco+'/100</span></div>';

function paintCtrl(c,d){var el=document.getElementById('ctrlBody');if(!el)return;var ci=[],ni=[];
  GROUPS.forEach(g=>{if(!vis(g,d.mode))return;g.fields.forEach(f=>{if(f.ctrl==null||f.type==='text'||f.type==='select')return;var val;
    if(f.k==='depositPct')val=num(d.purchasePrice)*num(d.depositPct)/100;else if(f.k==='arrangeFeePct')val=c.arrange;else if(f.k==='agentPct')val=c.sellAgent;else if(f.type==='num')return;else val=num(d[f.k]);
    (f.ctrl?ci:ni).push([f.label,val]);});});
  ni.push(['Stamp Duty',c.stamp]);var ct=ci.reduce((a,x)=>a+x[1],0),nt=ni.reduce((a,x)=>a+x[1],0),p=c.totalProjectCost||1;

  el.innerHTML='<div class="grp"><h3>You can control</h3>'+tbl(ci,ct,'Running total')+'</div><div class="grp"><h3>You cannot control</h3>'+tbl(ni,nt,'Running total')+'<div class="hint">Market interest rates, inflation, planning and tax sit behind these — the stress tests show your exposure.</div></div>';

function pdfText(s){return String(s==null?'':s).replace(/[−–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/∞/g,'inf').replace(/[▲▼·→]/g,'-').replace(/[^\x00-\xFF]/g,'?');}
function pdfEsc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]/g,' ');}
function pdfW(s,size){var W={' ':278,',':278,'.':278,'-':333,'%':889,'/':278,'£':556,':':278,'(':333,')':333};var w=0;for(var i=0;i<s.length;i++){var ch=s[i];w+=W[ch]!=null?W[ch]:(ch>='0'&&ch<='9')?556:(ch>='A'&&ch<='Z')?667:500;}return w*size/1000;}

  sections.forEach(sec=>{if(y-34<bot)flush();T(mL,y,'F2',12,sec.h,[.12,.22,.39]);br(4);R(mL,mR,y);br(15);sec.rows.forEach(rw=>{if(y-15<bot)flush();var bold=!!rw[2],col=bold?[.12,.22,.39]:[.1,.1,.1];T(mL,y,bold?'F2':'F1',11,rw[0],col);var vs=String(rw[1]);T(mR-pdfW(pdfText(vs),11),y,'F2',11,vs,col);br(15);});br(8);});
  flush();function cs(p){var s='';p.r.forEach(r=>{s+=r.c[0]+' '+r.c[1]+' '+r.c[2]+' RG 0.7 w '+r.x1+' '+r.y+' m '+r.x2+' '+r.y+' l S\n';});s+='BT\n';p.t.forEach(t=>{s+=t.c[0]+' '+t.c[1]+' '+t.c[2]+' rg /'+t.f+' '+t.s+' Tf 1 0 0 1 '+Math.round(t.x*100)/100+' '+Math.round(t.y*100)/100+' Tm ('+pdfEsc(t.t)+') Tj\n';});s+='ET\n';return s;}
  var out='%PDF-1.4\n%âãÏÓ\n',off={},cnt=0;function add(b){cnt++;off[cnt]=out.length;out+=cnt+' 0 obj\n'+b+'\nendobj\n';}
  var kids=[];for(var i=0;i<pages.length;i++)kids.push((5+2*i)+' 0 R');
  add('<< /Type /Catalog /Pages 2 0 R >>');add('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' /MediaBox [0 0 '+pw+' '+ph+'] >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  for(i=0;i<pages.length;i++){add('<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');var c=cs(pages[i]);add('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream');}
  var xp=out.length;out+='xref\n0 '+(cnt+1)+'\n0000000000 65535 f \n';for(i=1;i<=cnt;i++)out+=('0000000000'+off[i]).slice(-10)+' 00000 n \n';out+='trailer\n<< /Size '+(cnt+1)+' /Root 1 0 R >>\nstartxref\n'+xp+'\n%%EOF';
  var by=new Uint8Array(out.length);for(i=0;i<out.length;i++)by[i]=out.charCodeAt(i)&0xFF;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([by],{type:'application/pdf'}));a.download=fname;a.click();}
