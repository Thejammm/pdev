<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropDev — Developer Appraisal</title>
<style>
  :root{
    --bg:#e0e5ec;--card:#e0e5ec;--ink:#41485a;--muted:#818ca0;--faint:#a6afc0;--line:#d1d9e6;
    --navy:#41485a;--navy2:#5566d6;--accent:#5566d6;--flip:#c6742f;--flipbg:#e0e5ec;--btl:#1f8f77;--btlbg:#e0e5ec;
    --green:#2a9d6a;--greenbg:#d7e7de;--red:#d15757;--redbg:#eed9d9;--amber:#b9852a;--amberbg:#ece2cf;
    --lo:#ffffff;--hi:#a9b6cc;
    --sh:-6px -6px 12px var(--lo), 6px 6px 12px var(--hi);
    --shL:-9px -9px 18px var(--lo), 9px 9px 18px #a3b0c4;
    --shs:-3px -3px 7px var(--lo), 3px 3px 7px #b4c0d3;
    --shin:inset -5px -5px 10px var(--lo), inset 5px 5px 10px var(--hi);
    --shinS:inset -3px -3px 6px var(--lo), inset 3px 3px 6px #b4c0d3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
    background:var(--bg);font-size:15px;line-height:1.5;padding-bottom:60px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto}
  .wrap.wide{max-width:1150px}
  .appbar{background:var(--bg);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .appbar .ttl{font-size:16px;font-weight:800;letter-spacing:.2px;color:var(--ink)}
  .appbar .ttl span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:1px}
  .menu{position:relative}
  .ic{background:var(--bg);border:none;color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--sh)}
  .ic:active{box-shadow:var(--shinS)}
  .menu-pop{position:absolute;right:0;top:46px;background:var(--bg);border:none;border-radius:16px;
    box-shadow:var(--shL);min-width:212px;overflow:hidden;display:none;z-index:60;padding:6px}
  .menu-pop.open{display:block}
  .menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;border-radius:10px}
  .menu-pop button:active{box-shadow:var(--shinS)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px 4px}
  select.deals{border:none;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink);background:var(--bg);max-width:190px;box-shadow:var(--shinS)}
  .mini{background:var(--bg);border:none;border-radius:12px;padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--sh)}
  .mini:active{box-shadow:var(--shinS)}
  .seg{display:inline-flex;background:var(--bg);border-radius:14px;padding:5px;box-shadow:var(--shin)}
  .seg button{border:none;background:none;padding:8px 15px;font-size:13px;font-weight:700;color:var(--muted);border-radius:10px;cursor:pointer}
  .seg button.on{background:var(--bg);color:var(--navy);box-shadow:var(--shs)}
  .stick{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 18px 2px}
  .summary{background:var(--bg);border:none;border-radius:20px;padding:18px 20px;box-shadow:var(--shL)}
  .summary .top{display:flex;justify-content:space-between;align-items:flex-start}
  .summary .lab{font-size:12px;color:var(--muted);font-weight:600}
  .summary .big{font-size:29px;font-weight:800;letter-spacing:-.6px;margin:3px 0 0;font-variant-numeric:tabular-nums}
  .summary .big.pos{color:var(--green)} .summary .big.neg{color:var(--red)}
  .pill{font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px;white-space:nowrap;background:var(--bg);box-shadow:var(--shs)}
  .pill.green{color:var(--green)} .pill.amber{color:var(--amber)} .pill.red{color:var(--red)}
  .summary .mini{font-size:12.5px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums;box-shadow:none;padding:0;border-radius:0;cursor:default}
  .summary .mini b{color:var(--ink);font-weight:700}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:none;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;padding:9px 15px;border-radius:12px;cursor:pointer;white-space:nowrap;flex:none;box-shadow:var(--shs)}
  .tabs button.on{color:var(--navy);box-shadow:var(--shin)}
  .tabc{padding:16px 18px 26px}
  .grp{background:var(--bg);border:none;border-radius:18px;padding:6px 18px;margin-bottom:16px;box-shadow:var(--sh)}
  .grp h3{font-size:13.5px;font-weight:700;margin:14px 2px 6px;letter-spacing:.1px}
  .fld{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .fld:last-of-type{border-bottom:none}
  .fld .l{font-size:14px;color:var(--ink)}
  .fld .l .q{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:10px;font-weight:800;align-items:center;justify-content:center;cursor:help;margin-left:6px;vertical-align:middle;box-shadow:var(--shs)}
  .inp{width:128px;text-align:right;border:none;border-radius:12px;padding:11px 13px;font-size:15px;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--navy);font-weight:700;box-shadow:var(--shinS)}
  .inp:focus{outline:none;box-shadow:var(--shin)}
  .inp.txt{width:190px;text-align:left;color:var(--ink);font-weight:600}
  select.inp{width:auto;min-width:128px;font-weight:700}
  .affix{display:flex;align-items:center;gap:6px}
  .u{font-size:12px;color:var(--muted);font-weight:700}
  .lvhelp{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:11px 13px;margin:10px 0 4px;line-height:1.55;box-shadow:var(--shinS)}
  .lvhelp b{color:var(--ink);font-weight:700}
  .lvwarn{font-size:11.5px;color:var(--amber);background:var(--bg);border-radius:12px;padding:11px 13px;margin:10px 0 4px;font-weight:600;line-height:1.55;box-shadow:var(--shinS)}
  .mlink{display:inline-block;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;padding:9px 2px 4px}
  .mlink:active{opacity:.6}
  .det-tog{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:12px 2px 10px}
  .det-tog .cx{transition:transform .15s;font-weight:800}
  .det-tog.open .cx{transform:rotate(90deg)}
  .det{display:none;background:var(--bg);border:none;border-radius:14px;padding:6px 15px;margin:0 0 12px;box-shadow:var(--shinS)}
  .det.open{display:block}
  .o{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .o:last-child{border-bottom:none}
  .o .v{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .o .v.pos{color:var(--green)} .o .v.neg{color:var(--red)}
  .o.big{padding:11px 0} .o.big .v{font-size:16px}
  textarea.notes{width:100%;border:none;border-radius:14px;padding:11px 13px;font-size:13px;background:var(--bg);margin:6px 0 10px;font-family:inherit;resize:vertical;min-height:46px;box-shadow:var(--shinS);color:var(--ink)}
  .score{display:flex;align-items:center;gap:18px;background:var(--bg);border:none;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:var(--shL)}
  .ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none;box-shadow:var(--sh)}
  .score .t b{display:block;font-size:16px} .score .t{font-size:13px;color:var(--muted)}
  .hbs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .hb{background:var(--bg);border:none;border-radius:16px;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)}
  .hb .k{font-size:13px;font-weight:600} .hb .p{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:var(--bg);box-shadow:var(--shs)}
  .p.green{color:var(--green)} .p.amber{color:var(--amber)} .p.red{color:var(--red)}
  .kv{background:var(--bg);border:none;border-radius:18px;padding:6px 18px;margin-bottom:16px;box-shadow:var(--sh)}
  .slider{padding:12px 2px;border-bottom:1px solid var(--line)}
  .slider .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
  .slider .t .val{color:var(--accent);font-weight:800}
  .slider input[type=range]{width:100%;margin-top:9px;accent-color:var(--accent)}
  .stressgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
  .stress{border:none;background:var(--bg);border-radius:14px;padding:13px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left;box-shadow:var(--sh)}
  .stress.on{color:var(--accent);box-shadow:var(--shin)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl td{padding:9px 2px;border-bottom:1px solid var(--line)}
  .tbl td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .tbl tr.tot td{border-top:2px solid var(--faint);font-weight:800;color:var(--navy);border-bottom:none;padding-top:9px}
  .hint{font-size:12px;color:var(--muted);margin:2px 2px 12px;line-height:1.5}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:20px 4px 10px}
  .note{font-size:12px;color:var(--muted);background:var(--bg);border:none;border-radius:16px;padding:13px 15px;margin-top:14px;line-height:1.5;box-shadow:var(--shinS)}
  .pdfbtn{width:100%;background:var(--bg);color:var(--navy);border:none;border-radius:16px;padding:15px;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;box-shadow:var(--sh)}
  .pdfbtn:active{box-shadow:var(--shin)}
  .ttl.dealname{cursor:pointer}
  .dashwrap{padding:16px 18px 26px}
  .filters{display:flex;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
  .chip{background:var(--bg);border:none;border-radius:20px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--shs)}
  .chip.on{color:var(--navy);box-shadow:var(--shin)}
  .pcard{background:var(--bg);border:none;border-radius:18px;padding:15px 17px;margin-bottom:14px;box-shadow:var(--sh)}
  .pctop{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
  .pctop:active{opacity:.7}
  .pcname{font-size:15px;font-weight:700}
  .pcmeta{font-size:12px;color:var(--muted);margin-top:3px}
  .pcright{text-align:right;flex:none}
  .cardtog{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:7px;box-shadow:var(--shin)}
  .cardtog button{border:none;background:none;font-size:10.5px;font-weight:800;color:var(--muted);padding:4px 10px;border-radius:7px;cursor:pointer}
  .cardtog button.on{color:var(--navy);box-shadow:var(--shs)}
  .pcbig{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .pcbig.pos{color:var(--green)} .pcbig.neg{color:var(--red)}
  .pclab{font-size:10.5px;color:var(--muted)}
  .newbtn{width:100%;background:var(--bg);color:var(--navy);border:none;border-radius:18px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;box-shadow:var(--shL)}
  .newbtn:active{box-shadow:var(--shin)}
  .cmpbtn{width:100%;background:var(--bg);border:none;color:var(--accent);border-radius:16px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;margin-top:11px;box-shadow:var(--sh)}
  .cmpbtn:active{box-shadow:var(--shin)}
  .cmpchips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .cmpchip{background:var(--bg);border:none;border-radius:20px;padding:9px 15px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--shs)}
  .cmpchip.on{color:var(--navy);box-shadow:var(--shin)}
  .cmpchip.on.flip{color:var(--flip)} .cmpchip.on.btl{color:var(--btl)}
  .cmptbl-wrap{overflow-x:auto;background:var(--bg);border-radius:18px;padding:6px 14px;box-shadow:var(--sh)}
  .cmptbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .cmptbl th{padding:10px 6px;text-align:center;font-size:12px;font-weight:800;vertical-align:top;border-bottom:2px solid var(--line)}
  .cmpname{font-size:11.5px;margin-top:4px;line-height:1.2}
  .cmptbl td{padding:10px 5px;text-align:center;border-bottom:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
  .cmptbl td.rl{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;white-space:nowrap}
  .cmptbl td.best{color:var(--green);background:var(--greenbg);border-radius:8px}
  .cmptbl td.na{color:var(--faint);font-weight:600}
  .cmptbl td:not(.rl){cursor:pointer}
  .cmptbl td:not(.rl):active{opacity:.6}
  .cmptbl .csub{display:block;font-size:10px;color:var(--muted);font-weight:600}
  .cmpset{background:var(--bg);border:none;border-radius:16px;padding:8px 16px;margin-bottom:16px;box-shadow:var(--sh)}
  .cmpset-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:8px 0}
  .cmprow{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line)}
  .cmprow:last-child{border-bottom:none}
  .cmprow input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:14px}
  .mini.save{color:var(--green)}
  .mini.del{color:var(--red)}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--navy);padding:13px 22px;border-radius:22px;font-size:14px;font-weight:700;z-index:200;box-shadow:var(--shL)}
  /* mode colours */
  .seg button[data-m="flip"].on{color:var(--flip)} .seg button[data-m="btl"].on{color:var(--btl)}
  .summary.flip{border-left:5px solid var(--flip)} .summary.btl{border-left:5px solid var(--btl)}
  .modetag{font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:20px;background:var(--bg);box-shadow:var(--shs)}
  .modetag.flip{color:var(--flip)} .modetag.btl{color:var(--btl)}
  .pcard.flip{border-left:5px solid var(--flip)} .pcard.btl{border-left:5px solid var(--btl)}
  .pcard.flip .cardtog button.on{color:var(--flip)} .pcard.btl .cardtog button.on{color:var(--btl)}
  .tabs button.on.flip{color:var(--flip)} .tabs button.on.btl{color:var(--btl)}
  .grp.na{opacity:.55}
  .gtag{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;background:var(--bg);box-shadow:var(--shs)}
  .gtag.flip{color:var(--flip)} .gtag.btl{color:var(--btl)}
  .nabox{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:var(--shinS)}
  .fld.na{opacity:.55}
  .ftag{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;background:var(--bg);box-shadow:var(--shs)}
  .ftag.btl{color:var(--btl)} .ftag.flip{color:var(--flip)}
  /* scorecard */
  .sc-hero{background:var(--bg);border:none;border-radius:20px;padding:22px;margin-bottom:16px;text-align:center;box-shadow:var(--shL)}
  .sc-hero .lab{font-size:12px;color:var(--muted);font-weight:600}
  .sc-hero .big{font-size:33px;font-weight:800;letter-spacing:-.6px;margin:6px 0;font-variant-numeric:tabular-nums}
  .sc-hero .big.pos{color:var(--green)} .sc-hero .big.neg{color:var(--red)}
  .sc-hero .sub{font-size:12.5px;color:var(--muted)}
  .sc-bar{height:26px;border-radius:14px;overflow:hidden;display:flex;margin:12px 0;background:var(--bg);box-shadow:var(--shin)}
  .sc-bar .seg1{background:var(--navy2)}
  .sc-bar .seg2{background:var(--green)}
  .sc-bar .seg1.over{background:var(--red);width:100%}
  .sc-leg{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink);margin-bottom:16px}
  .sc-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
  .sc-leg .tot{color:var(--muted);font-weight:700;margin-left:auto}
  .growseg{display:flex;gap:8px;margin:2px 0 12px}
  .growseg button{flex:1;border:none;background:var(--bg);border-radius:12px;padding:11px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:var(--shs)}
  .growseg button.on{color:var(--btl);box-shadow:var(--shin)}
  .glegend{display:flex;gap:18px;margin:4px 0 10px;font-size:12px;font-weight:700;color:var(--muted)}
  .glegend .gk{display:flex;align-items:center;gap:6px}
  .gd{width:12px;height:12px;border-radius:4px;display:inline-block}
  .gd.val{background:var(--accent)} .gd.rent{background:var(--green)}
  .gtab{width:100%;border-collapse:collapse;font-size:13px}
  .gtab th,.gtab td{padding:10px 7px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
  .gtab thead th{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .gtab tbody th{text-align:left;font-weight:700;color:var(--ink);white-space:nowrap}
  .gtab .gval{color:var(--accent);font-weight:700}
  .gtab .grent{color:var(--green);font-weight:700}
  .gtab .gtot{font-weight:800;color:var(--navy)}
  .gtab .gsub{display:block;font-size:11px;font-weight:600;opacity:.8}
  .gtab tr:last-child td,.gtab tr:last-child th{border-bottom:none}
  .ghint{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.45;box-shadow:var(--shinS)}
  .pcbtns{display:flex;gap:18px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
  .pcact{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:0}
  .pcact:active{opacity:.6}
  .pcdel{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-left:auto}
  .pcdel:active{color:var(--red)}
  /* collapsible group */
  .ghead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:14px 2px;font-size:14px;font-weight:700}
  .ghead .gcx{color:var(--muted);font-weight:800;transition:transform .15s}
  .grp.open .ghead .gcx{transform:rotate(90deg)}
  .gbody{display:none} .grp.open .gbody{display:block}
  /* tooltips */
  .i{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:10px;font-weight:800;align-items:center;justify-content:center;cursor:pointer;margin-left:6px;vertical-align:middle;border:none;font-style:normal;box-shadow:var(--shs)}
  .i:active{box-shadow:var(--shinS)}
  .fh{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin:0 0 10px;line-height:1.45;box-shadow:var(--shinS)}
  .scen{display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--amber);border-radius:12px;padding:10px 13px;font-size:11.5px;font-weight:800;margin-top:10px;cursor:pointer;box-shadow:var(--shs)}
  /* portfolio / borrowing */
  .folio{background:var(--bg);border:none;border-radius:18px;padding:15px 17px;margin-bottom:16px;border-left:5px solid var(--btl);box-shadow:var(--sh)}
  .folio h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800}
  .fhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .fttl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800}
  .fhead .gcx{color:var(--muted);font-weight:800;transition:transform .15s}

function detFor(id,c){
  if(id==='purchase')return O('Discount below market value',pct(c.discount),c.discount>=0?'pos':'neg','','How far below market value you’re buying: (market value − purchase price) ÷ market value.')+O('£/m² purchase',money(c.ppm2),'','','Purchase price ÷ floor area.')+O('£/m² end value',money(c.gdvm2),'','','End value (GDV) ÷ floor area.');
  if(id==='finance')return O('Mortgage amount',money(c.mortgage),'','','Purchase price − deposit (£0 for a cash purchase).')+O('Loan to value',pct(c.ltv),'','','Mortgage ÷ purchase price.')+O('Monthly payment',money(c.monthlyPay),'','','Interest-only: mortgage × rate ÷ 12. Repayment: amortised over the term.')+O('Interest over project',money(c.financeInterest),'','','Monthly interest × the number of months you hold it.')+O('Total finance costs',money(c.financeCosts),'',true,'Arrangement fee + broker fee + valuation fee + all the interest over the project.');
  if(id==='rental')return O('Net cash flow / mo',money(c.netCF),c.netCF>=0?'pos':'neg',true,'Rent − mortgage payment − monthly operating costs.')+O('Annual cash flow',money(c.annualCF),c.annualCF>=0?'pos':'neg','','Monthly net cash flow × 12.')+O('Gross yield',pct(c.grossYield),'','','Annual rent ÷ purchase price.')+O('Net yield',pct(c.netYield),'','','(Annual rent − annual operating costs) ÷ (purchase + acquisition + refurb).')+O('Operating costs / mo',money(c.opMonthly),'','','Management + maintenance + void (% of rent), plus insurance, gas, electrical, licensing, ground rent and service charge ÷ 12.');
  if(id==='acq')return O('Stamp Duty (auto)',money(c.stamp),'','','Worked out automatically at additional-property rates for the purchase price.')+O('Total acquisition',money(c.acqTotal),'',true,'Stamp duty + solicitor + searches + survey + land registry + other mortgage fees + other.')+O('Cash before refurb',money(c.cashBeforeRefurb),'','','Deposit + acquisition costs + finance fees — the cash you need before any building work starts.');
  if(id==='refurb')return O('Subtotal',money(c.rBase),'','','Every refurbishment line above added together (before contingency).')+O('Contingency',money(c.contingency),'','','The contingency % applied to the refurb subtotal.')+O('Total refurbishment',money(c.refurb),'',true,'Refurb subtotal + contingency.')+O('Cost per m²',money(c.refurbm2),'','','Total refurbishment ÷ floor area.')+O('% of purchase price',pct(c.refurbPctPP),'','','Total refurbishment ÷ purchase price.');
  if(id==='holding')return O('Monthly (incl. mortgage)',money(c.holdMoIncl),'','','All monthly holding lines + the mortgage payment.')+O('Total (incl. mortgage)',money(c.holdTotIncl),'',true,'Monthly holding (incl. mortgage) × project months.')+O('Excl. mortgage',money(c.holdTotNonMort),'','','Holding total without the mortgage — the mortgage sits under Finance so it isn’t counted twice.');
  if(id==='selling')return O('Agent fee',money(c.sellAgent),'','','Estate agent % × end value (GDV).')+O('Total selling costs',money(c.sellTotal),'',true,'Agent fee + solicitor + EPC + marketing + staging + other.');
  return '';
}
function healthScores(c){var isB=c.isBtl;function W(v){return v>=70?'Excellent':v>=45?'Fair':'Poor';}function B(v){return v>=70?'green':v>=45?'amber':'red';}
  var purchase=c.discount>=0.1?90:c.discount>=0.03?60:c.discount>=0?40:15;
  var finance=(c.gdv>0)?(c.financeCosts/c.gdv<0.06?90:c.financeCosts/c.gdv<0.1?60:c.financeCosts/c.gdv<0.15?40:15):50;
  var cashflow=isB?(c.netCF>=250?90:c.netCF>=100?65:c.netCF>=0?40:10):(c.profitPM>=4000?90:c.profitPM>=1500?60:c.profitPM>=0?35:10);
  var roiS=isB?(c.coc>=0.09?90:c.coc>=0.06?60:c.coc>=0?35:10):(c.roi>=0.25?90:c.roi>=0.15?60:c.roi>=0.05?40:10);
  var profitS=isB?(c.equity>=40000?90:c.equity>=15000?60:c.equity>=0?35:10):(c.profit>=30000?90:c.profit>=15000?60:c.profit>=0?35:5);
  var items=[['Purchase price',purchase],['Finance',finance],['Cash flow',cashflow],['ROI',roiS],['Profit',profitS]].map(x=>({k:x[0],word:W(x[1]),band:B(x[1])}));
  return{items,overall:Math.round(purchase*0.15+finance*0.15+cashflow*0.2+roiS*0.25+profitS*0.25)};
}
function summaryTab(c,d){var isB=c.isBtl,s=healthScores(c),col=s.overall>=70?'green':s.overall>=45?'amber':'red';
  var cv={green:'var(--greenbg)',amber:'var(--amberbg)',red:'var(--redbg)'}[col],cf={green:'var(--green)',amber:'var(--amber)',red:'var(--red)'}[col];
  var h='<div class="score"><div class="ring" style="background:'+cv+';color:'+cf+'">'+s.overall+'</div><div class="t">Overall deal score<b>'+(s.overall>=70?'Strong deal':s.overall>=45?'Marginal — negotiate':'Poor — re-cut or walk')+'</b></div></div>';
  h+='<div class="hbs">'+s.items.map(it=>'<div class="hb"><span class="k">'+it.k+'</span><span class="p '+it.band+'">'+it.word+'</span></div>').join('')+'</div>';
  if(isB)h+='<h2 class="sec">Rent vs mortgage — every month</h2><div class="kv">'+O('Rent received',money(c.rentM),'','','The monthly rent you expect once done up.')+O('Mortgage payment','−'+money(c.monthlyPay),'neg','','Your monthly mortgage payment on this property.')+O('Running costs','−'+money(c.opMonthly),'neg','','Management, maintenance, void allowance, insurance, gas, electrical, licensing, ground rent and service charge.')+O('Net cash flow',money(c.netCF),c.netCF>=0?'pos':'neg',true,'Rent − mortgage − running costs. This is what you actually keep each month.')+'</div>';
  h+='<h2 class="sec">Where the money goes</h2><div class="kv">'+O('Purchase price',money(c.pp))+O('Acquisition',money(c.acqTotal),'','','Stamp duty + solicitor + searches + survey + land registry + other.')+O('Refurbishment',money(c.refurb),'','','All refurbishment lines + contingency.')+O('Finance',money(c.financeCosts),'','','Fees + interest over the whole project.')+O('Holding',money(c.holdTotNonMort),'','','Monthly holding (excl. mortgage) × months.')+(isB?'':O('Selling',money(c.sellTotal),'','','Agent fee + solicitor + EPC + marketing + staging + other.'))+O('Total project cost',money(c.totalProjectCost),'',true,'Purchase + acquisition + refurbishment + finance + holding'+(isB?'.':' + selling.'))+'</div>';
  h+='<h2 class="sec">Returns</h2><div class="kv">'+(isB?O('Annual cash flow',money(c.annualCF),c.annualCF>=0?'pos':'neg',true,'Monthly net cash flow × 12.')+O('Cash-on-cash',pct(c.coc),'','','Annual cash flow ÷ total cash invested.')+O('Gross / net yield',pct(c.grossYield)+' / '+pct(c.netYield),'','','Gross: annual rent ÷ price. Net: income after operating costs ÷ money in.')+O('Equity created',money(c.equity),'','','End value − the new mortgage after you refinance.')+O('Capital left in',money(c.capitalLeftIn),'','','Cash invested − cash released when you refinance.')+O('Return on cash left in',pct(c.cocLeftIn),'','','Annual cash flow ÷ the capital still left in the deal.'):O('Expected profit',money(c.profit),c.profit>=0?'pos':'neg',true,'End value (GDV) − total project cost.')+O('ROI',pct(c.roi),'','','Profit ÷ total cash invested.')+O('ROCE',pct(c.roce),'','','Profit ÷ total project cost.')+O('Profit / month',money(c.profitPM),'','','Profit ÷ project months.')+O('Profit margin (on GDV)',pct(c.margin),'','','Profit ÷ end value.')+O('Break-even sale',money(c.breakEven),'','','The sale price where profit is exactly zero, allowing for the agent’s %.'))+O('Total cash needed',money(c.cashInvested),'','','Deposit + acquisition + finance fees + refurbishment + holding (excl. mortgage).')+'</div>';
  return h;
}
function scorecardTab(c,d){
  if(!c.isBtl){
    var cost=c.totalProjectCost,gdv=c.gdv,profit=c.profit;
    var costPct=gdv>0?Math.max(0,Math.min(100,cost/gdv*100)):100,pPct=Math.max(0,100-costPct);
    if(profit>=0&&pPct>0&&pPct<6){pPct=6;costPct=94;}
    var bar=profit>=0
      ? '<div class="sc-bar"><div class="seg1" style="width:'+costPct.toFixed(1)+'%"></div><div class="seg2" style="width:'+pPct.toFixed(1)+'%"></div></div>'
      : '<div class="sc-bar"><div class="seg1 over"></div></div>';
    var h='<div class="sc-hero"><div class="lab">Profit if you flip it</div><div class="big '+(profit>=0?'pos':'neg')+'">'+money(profit)+'</div><div class="sub">'+pct(c.margin)+' margin · '+pct(c.roi)+' return on your cash</div></div>';
    h+=bar+'<div class="sc-leg"><span><i style="background:var(--navy)"></i>Costs '+money(cost)+'</span><span><i style="background:var(--green)"></i>Profit '+money(profit)+(gdv>0?' ('+pct(c.margin)+')':'')+'</span><span class="tot">Sells for '+money(gdv)+'</span></div>';
    h+='<h2 class="sec">The purchase</h2><div class="kv">'+O('Purchase price',money(c.pp))+O('Your deposit',money(c.deposit),'','','At '+num(d.depositPct)+'% of the price.')+O('Mortgage / bridging loan',money(c.mortgage),'',true,'Purchase price − your deposit — the loan you take on ('+pct(c.ltv)+' LTV).')+'</div>';
    h+='<div class="kv">'+O('It costs you (all in)',money(cost),'','','Purchase + acquisition + refurbishment + finance + holding + selling.')+O('It sells for (GDV)',money(gdv))+O('Cash you tie up',money(c.cashInvested),'','','The deposit and costs you fund yourself.')+O('You keep (profit)',money(profit),profit>=0?'pos':'neg',true,'Sale price − everything it costs you.')+'</div>';
    return h;
  }
  var gp=num(d.growthPct)||5,g=gp/100,base=num(d.gdv)||num(d.marketValue)||c.pp;
  var run=c.monthlyPay+c.opMonthly;
  var h='<div class="sc-hero"><div class="lab">You keep each month</div><div class="big '+(c.netCF>=0?'pos':'neg')+'">'+money(c.netCF)+'/mo</div><div class="sub">'+money(c.annualCF)+' a year · '+pct(c.grossYield)+' gross yield</div></div>';
  h+='<h2 class="sec">The purchase</h2><div class="kv">'+O('Purchase price',money(c.pp))+O('Your deposit',money(c.deposit),'','','At '+num(d.depositPct)+'% of the price.')+O('Mortgage / loan',money(c.mortgage),'',true,'Purchase price − your deposit — the mortgage you need ('+pct(c.ltv)+' loan-to-value).')+'</div>';
  h+='<h2 class="sec">The monthly picture</h2><div class="kv">'+O('Rent it brings in',money(c.rentM)+'/mo')+O('Running costs (incl. mortgage)','−'+money(run)+'/mo','neg','','Mortgage '+money(c.monthlyPay)+' + running costs '+money(c.opMonthly)+'.')+O('You keep (net)',money(c.netCF)+'/mo',c.netCF>=0?'pos':'neg',true,'Rent − mortgage − running costs.')+O('Cash you put in',money(c.cashInvested))+'</div>';
  h+='<h2 class="sec">Your equity — what’s left in it</h2><div class="hint">Based on your '+num(d.depositPct)+'% deposit on the property you’re buying.</div><div class="kv">'+O('Property value',money(c.gdv))+O('Your mortgage (from your deposit)',money(c.mortgage),'','','Purchase price − your '+num(d.depositPct)+'% deposit ('+pct(c.ltv)+' loan-to-value).')+O('Your equity — what’s left in it',money(c.gdv-c.mortgage),(c.gdv-c.mortgage)>=0?'pos':'neg',true,'Property value − your mortgage. Grows as the value rises or you pay the loan down.')+'</div>';
  h+='<h2 class="sec">Optional — refinance to pull cash out</h2><div class="hint">If you remortgage later, pick the refinance LTV. Ignore this if you’re buying to hold.</div>';
  h+='<div class="growseg">'+[65,70,75,80].map(p=>'<button class="'+(num(d.refiLTV)===p?'on':'')+'" onclick="setRefiLtv('+p+')">'+p+'%</button>').join('')+'</div>';
  h+='<div class="kv">'+O('New mortgage at '+num(d.refiLTV)+'% LTV',money(c.newLoan),'','','Value × refinance LTV.')+O('Cash you can pull out',money(c.refiRelease),'pos',true,'New mortgage − your current mortgage.')+O('New mortgage payment',money(c.refiPay)+'/mo','neg','','Up from '+money(c.monthlyPay)+'/mo now.')+O('Net income after refinancing',money(c.refiNetCF)+'/mo',c.refiNetCF>=0?'pos':'neg',true,'Rent − the new (higher) mortgage − running costs.')+'</div>';
  var cover=c.refiPay>0?c.rentM/c.refiPay:Infinity;
  h+='<div class="lvhelp">Most BTL remortgages go up to <b>75%</b>, a few lenders to <b>80%</b>. A higher LTV pulls out more cash but leaves a bigger mortgage to service — and the rent still has to cover it.</div>';
  if(c.refiNetCF<0)h+='<div class="lvwarn">⚠ At '+num(d.refiLTV)+'% the new mortgage costs more than the rent brings in — you’d have to top it up each month.</div>';
  else if(isFinite(cover)&&cover<1.25)h+='<div class="lvwarn">⚠ The rent only covers '+Math.round(cover*100)+'% of the new mortgage interest — lenders usually want ~125–145%, so this LTV may not get approved.</div>';
  h+='<h2 class="sec">If the property grows in value</h2><div class="hint">UK house prices have risen about 5% a year on average over the long term (ONS House Price Index). Pick a rate — value today '+money(base)+'.</div>';
  h+='<div class="growseg">'+[3,4,5,7].map(p=>'<button class="'+(gp===p?'on':'')+'" onclick="setGrowth('+p+')">'+p+'%/yr</button>').join('')+'</div>';
  h+='<div class="glegend"><span class="gk"><i class="gd val"></i>Value growth</span><span class="gk"><i class="gd rent"></i>Rent kept</span></div>';
  h+='<table class="gtab"><thead><tr><th></th><th>Property value</th><th>Rent kept</th><th>Total gain</th></tr></thead><tbody>';
  [5,10,15].forEach(function(y){var val=base*Math.pow(1+g,y),gain=val-base,rent=c.netCF*12*y,tot=gain+rent;
    h+='<tr><th>In '+y+' years</th><td class="gval">'+money(val)+'<span class="gsub gval">+'+money(gain)+' growth</span></td><td class="grent">'+money(rent)+'</td><td class="gtot">'+money(tot)+'</td></tr>';});
  h+='</tbody></table>';
  h+='<div class="ghint"><b class="gval" style="color:var(--accent)">Value growth</b> is what the property gains in worth. <b class="grent" style="color:var(--green)">Rent kept</b> is the net cash you pocket each month ('+money(c.netCF)+'/mo after mortgage &amp; costs) added up over the years. Total gain gives you both together. Rough guide — ignores rent rises, remortgaging and selling costs.</div>';
  return h;
}
function setGrowth(p){deal().growthPct=p;save();renderTab();}
function setRefiLtv(p){deal().refiLTV=p;save();renderTab();}
var sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0},stressOn=null;
var SLIDERS=[['ppMult','Purchase price','mult',0.8,1.2,0.01],['gdvMult','End value / GDV','mult',0.8,1.2,0.01],['refurbMult','Refurbishment','mult',0.8,1.2,0.01],['rateDelta','Interest rate','pp',-5,5,0.25],['rentMult','Monthly rent','mult',0.8,1.2,0.01],['monthsDelta','Holding period','mo',-12,12,1]];
var STRESS=[['Refurb +10%',{refurbMult:1.1}],['Refurb +20%',{refurbMult:1.2}],['Interest +1%',{rateDelta:1}],['Interest +2%',{rateDelta:2}],['Sale −5%',{gdvMult:0.95}],['Sale −10%',{gdvMult:0.9}],['Rent −10%',{rentMult:0.9}],['Vacant 3 mo',{rentMult:0.75}],['Delayed 3 mo',{monthsDelta:3}]];
function riskTab(){
  return '<div class="hint">Drag to test each assumption, or tap a stress test. The summary at the top updates too.</div>'+
    '<div class="grp" id="sliders"></div>'+
    '<h2 class="sec">One-click stress tests</h2><div class="stressgrid" id="stressgrid"></div>'+
    '<div class="grp" id="sensOut"></div>'+
    '<button class="mini" onclick="resetSens()">↺ Reset to base case</button>'+
    '<h2 class="sec">Controllable vs non-controllable</h2><div id="ctrlBody"></div>';
}
function paintRisk(d){
  var sl=document.getElementById('sliders');if(!sl)return;
  sl.innerHTML=SLIDERS.map(s=>{var v=sens[s[0]];var disp=s[2]==='mult'?(Math.round((v-1)*100)+'%'):s[2]==='pp'?((v>=0?'+':'')+v+'pp'):((v>=0?'+':'')+v+' mo');
    return '<div class="slider"><div class="t"><span>'+s[1]+'</span><span class="val" id="sr-'+s[0]+'">'+disp+'</span></div><input type="range" min="'+s[3]+'" max="'+s[4]+'" step="'+s[5]+'" value="'+v+'" oninput="onSlider(\''+s[0]+'\',this.value)"></div>';}).join('');
  document.getElementById('stressgrid').innerHTML=STRESS.map((s,i)=>'<button class="stress'+(stressOn===i?' on':'')+'" onclick="applyStress('+i+')">'+s[0]+'</button>').join('');
  paintSensOut(d);paintCtrl(calc(d),d);
}
function onSlider(k,v){sens[k]=parseFloat(v);stressOn=null;var s=SLIDERS.find(x=>x[0]===k);
  var disp=s[2]==='mult'?(Math.round((sens[k]-1)*100)+'%'):s[2]==='pp'?((sens[k]>=0?'+':'')+sens[k]+'pp'):((sens[k]>=0?'+':'')+sens[k]+' mo');
  var r=document.getElementById('sr-'+k);if(r)r.textContent=disp;
  document.querySelectorAll('.stress').forEach(b=>b.classList.remove('on'));
  paintSensOut(deal());repaint();}
function applyStress(i){if(stressOn===i){resetSens();return;}stressOn=i;sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0};Object.assign(sens,STRESS[i][1]);paintRisk(deal());repaint();}
function resetSens(){sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0};stressOn=null;paintRisk(deal());repaint();}
function paintSensOut(d){var el=document.getElementById('sensOut');if(!el)return;var base=calc(d),sc=calc(d,sens),isB=base.isBtl;
  function dl(a,b,m){var diff=b-a;return '<span style="color:var(--faint);font-weight:600">('+(diff>=0?'+':'−')+(m?money(Math.abs(diff)).replace('−',''):pct(Math.abs(diff)))+')</span>';}
  var pf=isB?sc.annualCF:sc.profit,pf0=isB?base.annualCF:base.profit,rv=isB?sc.coc:sc.roi,rv0=isB?base.coc:base.roi,cfv=isB?sc.netCF:sc.profitPM;
  var sco=healthScores(sc).overall,tl=sco>=70?'green':sco>=45?'amber':'red';
  el.innerHTML=O(isB?'Annual cash flow':'Profit',money(pf)+' '+dl(pf0,pf,true),pf>=0?'pos':'neg',true)+O(isB?'Cash-on-cash':'ROI',pct(rv)+' '+dl(rv0,rv,false))+O('Monthly cash flow',money(cfv),cfv>=0?'pos':'neg')+O('Equity',money(isB?sc.equity:sc.profit))+'<div class="o big"><span>Scenario verdict</span><span class="p '+tl+'">'+(tl==='green'?'Strong':tl==='amber'?'Marginal':'Poor')+' · '+sco+'/100</span></div>';
}
function paintCtrl(c,d){var el=document.getElementById('ctrlBody');if(!el)return;var ci=[],ni=[];
  GROUPS.forEach(g=>{if(!vis(g,d.mode))return;g.fields.forEach(f=>{if(f.ctrl==null||f.type==='text'||f.type==='select')return;var val;
    if(f.k==='depositPct')val=num(d.purchasePrice)*num(d.depositPct)/100;else if(f.k==='arrangeFeePct')val=c.arrange;else if(f.k==='agentPct')val=c.sellAgent;else if(f.type==='num')return;else val=num(d[f.k]);
    (f.ctrl?ci:ni).push([f.label,val]);});});
  ni.push(['Stamp Duty',c.stamp]);var ct=ci.reduce((a,x)=>a+x[1],0),nt=ni.reduce((a,x)=>a+x[1],0),p=c.totalProjectCost||1;
  function tbl(a,tot,l){return '<table class="tbl">'+a.map(x=>'<tr><td>'+x[0]+'</td><td>'+money(x[1])+'</td></tr>').join('')+'<tr class="tot"><td>'+l+' ('+pct(tot/p)+' of cost)</td><td>'+money(tot)+'</td></tr></table>';}
  el.innerHTML='<div class="grp"><h3>You can control</h3>'+tbl(ci,ct,'Running total')+'</div><div class="grp"><h3>You cannot control</h3>'+tbl(ni,nt,'Running total')+'<div class="hint">Market interest rates, inflation, planning and tax sit behind these — the stress tests show your exposure.</div></div>';
}
function sensActive(){return sens.ppMult!==1||sens.gdvMult!==1||sens.refurbMult!==1||sens.rateDelta!==0||sens.rentMult!==1||sens.monthsDelta!==0;}
function ov(){return sensActive()?sens:{};}
function repaint(){var d=deal(),active=sensActive(),c=calc(d,ov());
  var s=healthScores(c),isB=c.isBtl,band=s.overall>=70?'green':s.overall>=45?'amber':'red';
  var big=isB?c.annualCF:c.profit,lab=isB?'Expected annual cash flow':'Expected profit';
  var sm=document.getElementById('summary');if(sm){sm.className='summary '+d.mode;
  sm.innerHTML='<div class="top"><div><div class="lab">'+lab+'</div><div class="big '+(big>=0?'pos':'neg')+'">'+money(big)+'</div></div><div style="text-align:right"><span class="modetag '+d.mode+'">'+(isB?'BUY TO LET':'FLIP')+'</span><div style="margin-top:7px"><span class="pill '+band+'">'+(band==='green'?'Strong':band==='amber'?'Marginal':'Poor')+' · '+s.overall+'</span></div></div></div>'+
    '<div class="mini">'+(isB?'Rent <b>'+money(c.rentM)+'</b> · Mortgage <b>'+money(c.monthlyPay)+'</b> · Net <b>'+money(c.netCF)+'/mo</b>':'ROI <b>'+pct(c.roi)+'</b> · Cash <b>'+money(c.cashInvested)+'</b>')+'</div>'+
    (active?'<div class="scen" onclick="resetSens()"><span>⚠ What-if scenario applied</span><span>Reset ✕</span></div>':'');}
  GROUPS.forEach(g=>{var el=document.getElementById('det-'+g.id);if(el)el.innerHTML=detFor(g.id,c);});
  var lh=document.getElementById('ltvHelp');if(lh)lh.innerHTML=ltvHelp(d);
  var ml=document.getElementById('mapLink');if(ml)ml.innerHTML=mapLinkHTML(d.postcode);
  if(curTab==='summary')document.getElementById('tabc').innerHTML=summaryTab(c,d);
  if(curTab==='scorecard')document.getElementById('tabc').innerHTML=scorecardTab(c,d);
}
function upd(k,v){var d=deal();d[k]=v;save();
  if(k==='mortgageType'||k==='mortgageBasis'){renderTab();repaint();return;}
  if(curTab==='summary'){renderTab();repaint();return;}
  repaint();}
function updDep(w,val){var d=deal(),pp=num(d.purchasePrice);
  if(w==='pct'){d.depositPct=num(val);var a=document.getElementById('dAmt');if(a)a.value=Math.round(pp*num(val)/100);}
  else{d.depositPct=pp>0?num(val)/pp*100:0;var p=document.getElementById('dPct');if(p)p.value=Math.round(d.depositPct*100)/100;}
  var lt=document.getElementById('dLtv');if(lt)lt.value=Math.round((100-d.depositPct)*10)/10;
  save();repaint();}
function updLtv(val){var d=deal(),lv=Math.max(0,Math.min(100,num(val)));d.depositPct=100-lv;var pp=num(d.purchasePrice);
  var p=document.getElementById('dPct');if(p)p.value=Math.round(d.depositPct*100)/100;

function ltvHelp(d){var mt=d.mortgageType,ltv=100-num(d.depositPct),max,txt;
  if(mt==='cash')return '<div class="lvhelp"><b>Cash purchase</b> — no mortgage, you fund 100%. Switch the mortgage type to BTL or Bridging if you want to borrow and put in less.</div>';
  if(mt==='btl'){max=80;txt='<b>Buy-to-Let mortgages</b> usually go up to <b>75%</b> LTV (25% deposit), a few lenders to <b>80%</b>. The rent has to cover roughly <b>125–145%</b> of the mortgage interest (the lender’s stress test) — so a higher LTV needs stronger rent to qualify.';}
  else{max=75;txt='<b>Bridging</b> usually lends up to <b>70–75%</b> of the value. It’s short-term and expensive — you repay it by refinancing onto a BTL mortgage or selling.';}
  var warn=ltv>max?'<div class="lvwarn">⚠ '+Math.round(ltv)+'% LTV is above the ~'+max+'% most '+(mt==='btl'?'BTL':'bridging')+' lenders will do. You’d likely need a bigger deposit, or it won’t get approved.</div>':(ltv>=max-5&&ltv<=max?'<div class="lvhelp">You’re near the top of what lenders allow — expect fewer products and higher rates.</div>':'');
  return '<div class="lvhelp">'+txt+'</div>'+warn;}

function importJSON(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.deals)){alert('That is not a valid PropDev backup file.');return;}
  if(!store.deals)store.deals=[];
  var have={};store.deals.forEach(function(x){have[x.id]=x;});
  var added=0,updated=0;
  d.deals.forEach(function(nd){if(!nd||typeof nd!=='object')return;if(!nd.id)nd.id=uid();if(have[nd.id]){store.deals[store.deals.indexOf(have[nd.id])]=nd;updated++;}else{store.deals.push(nd);have[nd.id]=nd;added++;}});
  if(!store.current&&store.deals.length)store.current=store.deals[0].id;
  save();render();
  toast(added+' propert'+(added===1?'y':'ies')+' imported'+(updated?', '+updated+' updated':''));
}catch(err){alert('Could not read that file.');}};r.readAsText(f);e.target.value='';}
function pdfText(s){return String(s==null?'':s).replace(/[−–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/∞/g,'inf').replace(/[▲▼·→]/g,'-').replace(/[^\x00-\xFF]/g,'?');}
function pdfEsc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]/g,' ');}
function pdfW(s,size){var W={' ':278,',':278,'.':278,'-':333,'%':889,'/':278,'£':556,':':278,'(':333,')':333};var w=0;for(var i=0;i<s.length;i++){var ch=s[i];w+=W[ch]!=null?W[ch]:(ch>='0'&&ch<='9')?556:(ch>='A'&&ch<='Z')?667:500;}return w*size/1000;}
function makePDF(fname,title,subtitle,sections,opts){
  opts=opts||{};
  var pw=595,ph=842,mL=50,mR=545,cW=mR-mL,top=762,bot=60;
  var AC=opts.accent||[.12,.22,.39],INK=[.12,.13,.16],MUT=[.42,.42,.45],WHT=[1,1,1],BAND=[.13,.15,.19],PANEL=[.945,.95,.955];
  var kicker=opts.kicker||'Property Development Appraisal',dstr=opts.date||today();
  var pages=[],pg={t:[],l:[],f:[]},y=top;
  function flush(){pages.push(pg);pg={t:[],l:[],f:[]};y=top;}
  function T(x,yy,f,s,t,c){pg.t.push({x:x,y:yy,f:f,s:s,t:pdfText(t),c:c||INK});}
  function TR(xr,yy,f,s,t,c){var str=pdfText(t);T(xr-pdfW(str,s),yy,f,s,str,c);}
  function TC(xc,yy,f,s,t,c){var str=pdfText(t);T(xc-pdfW(str,s)/2,yy,f,s,str,c);}
  function R(x1,x2,yy,c,w){pg.l.push({x1:x1,y1:yy,x2:x2,y2:yy,c:c||[.8,.8,.8],w:w||0.7});}
  function LN(x1,y1,x2,y2,c,w){pg.l.push({x1:x1,y1:y1,x2:x2,y2:y2,c:c||[.8,.8,.8],w:w||0.7});}
  function FR(x,yTop,w,h,c){pg.f.push({x:x,y:yTop-h,w:w,h:h,c:c});}
  function br(h){y-=(h==null?15:h);if(y<bot)flush();}
  T(mL,y,'F2',21,title,INK);br(24);
  T(mL,y,'F1',10.5,subtitle,MUT);br(9);
  R(mL,mR,y,AC,1.4);br(16);
  if(opts.glance&&opts.glance.length){
    var G=opts.glance,H=72,yTop=y;
    FR(mL,yTop,cW,H,PANEL);
    T(mL+14,yTop-16,'F2',8,'AT A GLANCE',AC);
    var tw=cW/G.length;
    G.forEach(function(gi,i){
      if(i>0)LN(mL+tw*i,yTop-24,mL+tw*i,yTop-H+10,[.82,.83,.85],0.7);
      var cx=mL+tw*(i+0.5),vs=pdfText(gi.val),vsz=15;
      if(pdfW(vs,vsz)>tw-12)vsz=12;if(pdfW(vs,vsz)>tw-12)vsz=10.5;
      TC(cx,yTop-46,'F2',vsz,gi.val,gi.c||INK);
      TC(cx,yTop-61,'F1',8,String(gi.lab).toUpperCase(),MUT);
    });
    y=yTop-H;br(20);
  }
  sections.forEach(function(sec){
    if(y-40<bot)flush();
    FR(mL,y+9,7,7,AC);
    T(mL+13,y,'F2',12,sec.h,INK);br(6);
    R(mL,mR,y,AC,1.1);br(15);
    if(sec.cols){
      var nc=sec.cols.length,cs0=mL+150,cw=(mR-cs0)/nc;
      sec.cols.forEach(function(ch,j){var cx=cs0+cw*(j+1);TR(cx-2,y,'F2',9,String(ch),AC);});br(5);R(mL,mR,y,[.8,.8,.8],0.7);br(14);
      sec.rows.forEach(function(rw){if(y-14<bot)flush();T(mL,y,'F1',10,rw[0],INK);for(var j=0;j<nc;j++){var cx=cs0+cw*(j+1);TR(cx-2,y,'F2',10,String(rw[j+1]),INK);}br(14);});br(10);
    }else{
      sec.rows.forEach(function(rw){if(y-15<bot)flush();var bold=!!rw[2],col=bold?AC:INK;if(bold)R(mL,mR,y+11,[.86,.87,.89],0.7);T(mL,y,bold?'F2':'F1',11,rw[0],bold?INK:[.2,.2,.23]);TR(mR,y,'F2',11,String(rw[1]),col);br(15);});br(10);
    }
  });
  flush();
  function r2(n){return Math.round(n*100)/100;}
  function band(c,x,yb,w,h){return c[0]+' '+c[1]+' '+c[2]+' rg '+r2(x)+' '+r2(yb)+' '+r2(w)+' '+r2(h)+' re f\n';}
  function line(c,x1,y1,x2,y2,w){return c[0]+' '+c[1]+' '+c[2]+' RG '+w+' w '+r2(x1)+' '+r2(y1)+' m '+r2(x2)+' '+r2(y2)+' l S\n';}
  function txt(c,f,s,x,yy,t){return c[0]+' '+c[1]+' '+c[2]+' rg /'+f+' '+s+' Tf 1 0 0 1 '+r2(x)+' '+r2(yy)+' Tm ('+pdfEsc(pdfText(t))+') Tj\n';}
  function txtR(c,f,s,xr,yy,t){var str=pdfText(t);return txt(c,f,s,xr-pdfW(str,s),yy,str);}
  function cs(p,idx,total){
    var s='';
    s+=band(BAND,0,ph-58,pw,58);
    p.f.forEach(function(fr){s+=band(fr.c,fr.x,fr.y,fr.w,fr.h);});
    s+=line(AC,mL,ph-64,mR,ph-64,1.6);
    s+=line([.5,.5,.52],mL,ph-67.5,mR,ph-67.5,0.6);
    s+=line([.75,.75,.77],mL,46,mR,46,0.7);
    p.l.forEach(function(l){s+=line(l.c,l.x1,l.y1,l.x2,l.y2,l.w);});
    s+='BT\n';
    s+=txt(WHT,'F2',22,mL,ph-36,'PropDev');
    s+=txt([.76,.78,.82],'F1',8,mL,ph-49,kicker.toUpperCase());
    s+=txtR([.82,.84,.88],'F1',9,mR,ph-36,dstr);
    s+=txtR([.6,.62,.66],'F1',7.5,mR,ph-49,'APPRAISAL REPORT');
    s+=txt([.5,.5,.53],'F1',8,mL,34,'PropDev  ·  pdev.archerhs.co.uk');
    s+=txtR([.5,.5,.53],'F1',8,mR,34,'Page '+idx+' of '+total+'  ·  '+dstr);
    p.t.forEach(function(t){s+=txt(t.c,t.f,t.s,t.x,t.y,t.t);});
    s+='ET\n';
    return s;
  }
  var out='%PDF-1.4\n%âãÏÓ\n',off={},cnt=0;function add(b){cnt++;off[cnt]=out.length;out+=cnt+' 0 obj\n'+b+'\nendobj\n';}
  var kids=[];for(var i=0;i<pages.length;i++)kids.push((5+2*i)+' 0 R');
  add('<< /Type /Catalog /Pages 2 0 R >>');add('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' /MediaBox [0 0 '+pw+' '+ph+'] >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  for(i=0;i<pages.length;i++){add('<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');var c=cs(pages[i],i+1,pages.length);add('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream');}
  var xp=out.length;out+='xref\n0 '+(cnt+1)+'\n0000000000 65535 f \n';for(i=1;i<=cnt;i++)out+=('0000000000'+off[i]).slice(-10)+' 00000 n \n';out+='trailer\n<< /Size '+(cnt+1)+' /Root 1 0 R >>\nstartxref\n'+xp+'\n%%EOF';
  var by=new Uint8Array(out.length);for(i=0;i<out.length;i++)by[i]=out.charCodeAt(i)&0xFF;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([by],{type:'application/pdf'}));a.download=fname;a.click();
}
function exportPDF(){var d=deal(),c=calc(d),isB=c.isBtl;
  var gp=num(d.growthPct)||5,g=gp/100,base=num(d.gdv)||num(d.marketValue)||c.pp;
  var secs=[];
  secs.push({h:'Headline',rows:[['Deal score',healthScores(c).overall+' / 100',true],[isB?'Net cash flow / mo':'Expected profit',isB?money(c.netCF):money(c.profit),true],[isB?'Annual cash flow':'Profit margin (on GDV)',isB?money(c.annualCF):pct(c.margin)],[isB?'Gross yield':'Return on cash (ROI)',isB?pct(c.grossYield):pct(c.roi)],['Total cash needed',money(c.cashInvested)],isB?['Cash-on-cash return',pct(c.coc)]:['Break-even sale',money(c.breakEven)]]});
  secs.push({h:'The purchase',rows:[['Address',d.address||'-'],['Purchase price',money(c.pp)],['Market value (as-is)',money(num(d.marketValue))],['End value / GDV',money(c.gdv)],['Discount below market value',pct(c.discount)],['Your deposit ('+num(d.depositPct)+'%)',money(c.deposit)],['Mortgage / loan',money(c.mortgage)],['Loan to value (LTV)',pct(c.ltv)],['Floor area',num(d.floorArea)+' m2'],['Price per m2',money(c.ppm2)]]});
  if(isB){
    secs.push({h:'Rent vs mortgage - every month',rows:[['Rent received',money(c.rentM)],['Mortgage payment',money(c.monthlyPay)],['Running costs',money(c.opMonthly)],['Net cash flow',money(c.netCF),true],['Annual cash flow',money(c.annualCF)]]});
    secs.push({h:'Your equity',rows:[['Property value',money(c.gdv)],['Your mortgage',money(c.mortgage)],['Your equity (what is left in it)',money(c.gdv-c.mortgage),true],['Gross yield',pct(c.grossYield)],['Net yield',pct(c.netYield)]]});
    secs.push({h:'Refinance to pull cash out (at '+num(d.refiLTV)+'% LTV)',rows:[['New mortgage',money(c.newLoan)],['Cash you can pull out',money(c.refiRelease),true],['New mortgage payment',money(c.refiPay)+' /mo'],['Net income after refinancing',money(c.refiNetCF)+' /mo'],['Capital left in the deal',money(c.capitalLeftIn)]]});
    var grows=[['Value today',money(base)]];[5,10,15].forEach(function(y){var val=base*Math.pow(1+g,y),gain=val-base,rent=c.netCF*12*y;grows.push(['In '+y+' yrs - property value',money(val)+' (+'+money(gain)+')']);grows.push(['In '+y+' yrs - rent kept',money(rent)]);grows.push(['In '+y+' yrs - total gain',money(gain+rent),true]);});
    secs.push({h:'If it grows in value (at '+gp+'%/yr)',rows:grows});
  }else{
    secs.push({h:'Costs vs sale vs profit',rows:[['It costs you (all in)',money(c.totalProjectCost)],['It sells for (GDV)',money(c.gdv)],['Cash you tie up',money(c.cashInvested)],['Profit',money(c.profit),true],['Profit margin (on GDV)',pct(c.margin)],['Return on cash (ROI)',pct(c.roi)]]});
  }
  secs.push({h:'Acquisition costs',rows:[['Stamp Duty',money(c.stamp)],['Solicitor',money(num(d.solicitorAcq))],['Searches',money(num(d.searches))],['Survey',money(num(d.survey))],['Land Registry',money(num(d.landRegistry))],['Other',money(num(d.otherAcq)+num(d.mortgageFeesAcq))],['Total acquisition',money(c.acqTotal),true]]});
  secs.push({h:'Refurbishment',rows:[['Subtotal',money(c.rBase)],['Contingency ('+num(d.contingencyPct)+'%)',money(c.contingency)],['Total refurbishment',money(c.refurb),true],['Cost per m2',money(c.refurbm2)],['% of purchase price',pct(c.refurbPctPP)]]});
  secs.push({h:'Holding',rows:[['Monthly (incl. mortgage)',money(c.holdMoIncl)],['Project duration',c.months+' months'],['Total (excl. mortgage)',money(c.holdTotNonMort),true]]});
  secs.push({h:'Finance costs',rows:[['Arrangement fee',money(c.arrange)],['Broker fee',money(num(d.brokerFee))],['Valuation fee',money(num(d.valuationFee))],['Interest over project',money(c.financeInterest)],['Total finance costs',money(c.financeCosts),true]]});
  if(!isB)secs.push({h:'Selling costs',rows:[['Agent fee',money(c.sellAgent)],['Fixed selling costs',money(c.sellFixed)],['Total selling costs',money(c.sellTotal),true]]});
  secs.push({h:'Totals & returns',rows:[['Total project cost',money(c.totalProjectCost)],['Total cash needed',money(c.cashInvested)],[isB?'Equity created':'Profit',money(c.equity),true],[isB?'Return on cash left in':'ROCE',pct(isB?c.cocLeftIn:c.roce)]]});
  var posc=[.16,.5,.34],negc=[.75,.25,.25];
  var glance=isB?[{lab:'Deal score',val:healthScores(c).overall+'/100'},{lab:'Net cash flow',val:money(c.netCF)+'/mo',c:c.netCF>=0?posc:negc},{lab:'Gross yield',val:pct(c.grossYield)},{lab:'Cash needed',val:money(c.cashInvested)}]
    :[{lab:'Deal score',val:healthScores(c).overall+'/100'},{lab:'Profit',val:money(c.profit),c:c.profit>=0?posc:negc},{lab:'ROI',val:pct(c.roi)},{lab:'Cash needed',val:money(c.cashInvested)}];
  var accent=isB?[.12,.56,.47]:[.78,.45,.18];
  makePDF((d.name||'appraisal').replace(/[^\w -]/g,'')+'.pdf',d.name||'Appraisal',(isB?'Buy-to-Let investment appraisal':'Flip / development appraisal'),secs,{accent:accent,kicker:(isB?'Buy-to-Let Investment Appraisal':'Flip / Development Appraisal'),glance:glance,date:today()});}
