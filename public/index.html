<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropDev — Developer Appraisal</title>
<style>
  :root{
    --ink:#1c2433;--muted:#7a8290;--faint:#aab2bf;--line:#eceef3;--bg:#f4f6fa;--card:#fff;
    --navy:#1f3864;--navy2:#33589a;--accent:#2e5ba8;--flip:#a35a12;--flipbg:#fbf1e2;--btl:#12705e;--btlbg:#e4f4ef;
    --green:#1f7a52;--greenbg:#eaf5ee;--red:#b23b3b;--redbg:#fbeceb;--amber:#8a5d00;--amberbg:#fdf4de;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
    background:var(--bg);font-size:15px;line-height:1.5;padding-bottom:60px}
  .wrap{max-width:760px;margin:0 auto}
  .appbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;
    align-items:center;justify-content:space-between;gap:10px}
  .appbar .ttl{font-size:15px;font-weight:700;letter-spacing:.2px}
  .appbar .ttl span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:1px}
  .menu{position:relative}
  .ic{background:none;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
  .menu-pop{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(20,30,50,.16);min-width:190px;overflow:hidden;display:none;z-index:60}
  .menu-pop.open{display:block}
  .menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:12px 15px;font-size:14px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
  .menu-pop button:last-child{border-bottom:none}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px 4px}
  select.deals{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink);background:#fff;max-width:190px}
  .mini{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .seg{display:inline-flex;background:#e7ebf2;border-radius:10px;padding:3px}
  .seg button{border:none;background:none;padding:7px 13px;font-size:13px;font-weight:700;color:#67707f;border-radius:8px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,30,50,.12)}
  .stick{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 16px 0;border-bottom:1px solid var(--line)}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .summary .top{display:flex;justify-content:space-between;align-items:flex-start}
  .summary .lab{font-size:12px;color:var(--muted);font-weight:600}
  .summary .big{font-size:27px;font-weight:800;letter-spacing:-.6px;margin:2px 0 0}
  .summary .big.pos{color:var(--green)} .summary .big.neg{color:var(--red)}
  .pill{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap}
  .pill.green{background:var(--greenbg);color:var(--green)} .pill.amber{background:var(--amberbg);color:var(--amber)} .pill.red{background:var(--redbg);color:var(--red)}
  .summary .mini{font-size:12.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  .summary .mini b{color:var(--ink);font-weight:700}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:11px 0 9px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;flex:none}
  .tabs button.on{background:var(--navy);color:#fff}
  .tabc{padding:14px 16px 24px}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 15px;margin-bottom:12px}
  .grp h3{font-size:13.5px;font-weight:700;margin:13px 2px 5px;letter-spacing:.1px}
  .fld{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .fld:last-of-type{border-bottom:none}
  .fld .l{font-size:14px;color:var(--ink)}
  .fld .l .q{display:inline-flex;width:15px;height:15px;border-radius:50%;background:#eef1f6;color:#8792a2;font-size:10px;font-weight:800;align-items:center;justify-content:center;cursor:help;margin-left:5px;vertical-align:middle}
  .inp{width:128px;text-align:right;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;font-variant-numeric:tabular-nums;background:#fbfcfe;color:var(--navy);font-weight:700}
  .inp:focus{outline:none;border-color:var(--navy2);background:#fff}
  .inp.txt{width:190px;text-align:left;color:var(--ink);font-weight:600}
  select.inp{width:auto;min-width:128px;font-weight:700}
  .affix{display:flex;align-items:center;gap:4px}
  .u{font-size:12px;color:var(--muted);font-weight:700}
  .mlink{display:inline-block;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;padding:9px 2px 4px}
  .mlink:active{opacity:.6}
  .det-tog{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:11px 2px 9px}
  .det-tog .cx{transition:transform .15s;font-weight:800}
  .det-tog.open .cx{transform:rotate(90deg)}
  .det{display:none;background:#f7f9fc;border:1px dashed var(--line);border-radius:11px;padding:4px 13px;margin:0 0 10px}
  .det.open{display:block}
  .o{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eef1f6;font-size:13.5px}
  .o:last-child{border-bottom:none}
  .o .v{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .o .v.pos{color:var(--green)} .o .v.neg{color:var(--red)}
  .o.big{padding:9px 0} .o.big .v{font-size:16px}
  textarea.notes{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;background:#fbfcfe;margin:6px 0 10px;font-family:inherit;resize:vertical;min-height:44px}
  .score{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
  .ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none}
  .score .t b{display:block;font-size:16px} .score .t{font-size:13px;color:var(--muted)}
  .hbs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .hb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center}
  .hb .k{font-size:13px;font-weight:600} .hb .p{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
  .p.green{background:var(--greenbg);color:var(--green)} .p.amber{background:var(--amberbg);color:var(--amber)} .p.red{background:var(--redbg);color:var(--red)}
  .kv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 15px;margin-bottom:12px}
  .slider{padding:9px 2px;border-bottom:1px solid var(--line)}
  .slider .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
  .slider .t .val{color:var(--accent);font-weight:800}
  .slider input[type=range]{width:100%;margin-top:7px;accent-color:var(--navy2)}
  .stressgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
  .stress{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left}
  .stress.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl td{padding:7px 2px;border-bottom:1px solid var(--line)}
  .tbl td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .tbl tr.tot td{border-top:2px solid var(--navy);font-weight:800;color:var(--navy);border-bottom:none;padding-top:8px}
  .hint{font-size:12px;color:var(--muted);margin:2px 2px 10px;line-height:1.5}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:800;margin:16px 2px 8px}
  .note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:12px;line-height:1.5}
  .pdfbtn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px}
  .ttl.dealname{cursor:pointer}
  .dashwrap{padding:14px 16px 24px}
  .filters{display:flex;gap:7px;margin:4px 0 12px;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
  .pctop{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
  .pctop:active{opacity:.7}
  .pcname{font-size:15px;font-weight:700}
  .pcmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .pcright{text-align:right;flex:none}
  .cardtog{display:inline-flex;background:#eef1f6;border-radius:8px;padding:2px;margin-bottom:5px}
  .cardtog button{border:none;background:none;font-size:10.5px;font-weight:800;color:var(--muted);padding:3px 9px;border-radius:6px;cursor:pointer}
  .cardtog button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(20,30,50,.12)}
  .pcbig{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .pcbig.pos{color:var(--green)} .pcbig.neg{color:var(--red)}
  .pclab{font-size:10.5px;color:var(--muted)}
  .newbtn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:0 3px 10px rgba(31,56,100,.25)}
  .cmpbtn{width:100%;background:#fff;border:1px solid var(--navy);color:var(--navy);border-radius:13px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;margin-top:9px}
  .cmpchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .cmpchip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .cmpchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .cmpchip.on.flip{background:var(--flip);border-color:var(--flip)} .cmpchip.on.btl{background:var(--btl);border-color:var(--btl)}
  .cmptbl-wrap{overflow-x:auto}
  .cmptbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .cmptbl th{padding:9px 6px;text-align:center;font-size:12px;font-weight:800;vertical-align:top;border-bottom:2px solid var(--line)}
  .cmpname{font-size:11.5px;margin-top:4px;line-height:1.2}
  .cmptbl td{padding:9px 5px;text-align:center;border-bottom:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
  .cmptbl td.rl{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;white-space:nowrap}
  .cmptbl td.best{background:var(--greenbg);color:var(--green)}
  .cmptbl .csub{display:block;font-size:10px;color:var(--muted);font-weight:600}
  .cmpset{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:14px}
  .cmpset-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);margin:6px 0}
  .cmprow{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:14px;border-bottom:1px solid #f2f4f8}
  .cmprow:last-child{border-bottom:none}
  .cmprow input{width:19px;height:19px;flex:none}
  .empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
  .mini.save{background:var(--greenbg);color:var(--green);border-color:#cfe8d8}
  .mini.del{background:var(--redbg);color:var(--red);border-color:#f0cccc}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#182031;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:700;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  /* mode colours */
  .seg button[data-m="flip"].on{background:var(--flip);color:#fff} .seg button[data-m="btl"].on{background:var(--btl);color:#fff}
  .summary.flip{border-left:5px solid var(--flip)} .summary.btl{border-left:5px solid var(--btl)}
  .modetag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
  .modetag.flip{background:var(--flipbg);color:var(--flip)} .modetag.btl{background:var(--btlbg);color:var(--btl)}
  .pcard.flip{border-left:5px solid var(--flip)} .pcard.btl{border-left:5px solid var(--btl)}
  .pcard.flip .cardtog button.on{background:var(--flip);color:#fff} .pcard.btl .cardtog button.on{background:var(--btl);color:#fff}
  .tabs button.on.flip{background:var(--flip)} .tabs button.on.btl{background:var(--btl)}
  .grp.na{opacity:.6}
  .gtag{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;margin-left:8px;letter-spacing:.4px;vertical-align:middle}
  .gtag.flip{background:var(--flipbg);color:var(--flip)} .gtag.btl{background:var(--btlbg);color:var(--btl)}
  .nabox{font-size:11.5px;color:var(--muted);background:#f5f7fb;border-radius:8px;padding:8px 10px;margin:8px 0}
  .fld.na{opacity:.6}
  .ftag{font-size:9px;font-weight:800;padding:1px 7px;border-radius:20px;margin-left:6px;letter-spacing:.3px;vertical-align:middle}
  .ftag.btl{background:var(--btlbg);color:var(--btl)} .ftag.flip{background:var(--flipbg);color:var(--flip)}
  /* scorecard */
  .sc-hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;text-align:center}
  .sc-hero .lab{font-size:12px;color:var(--muted);font-weight:600}
  .sc-hero .big{font-size:32px;font-weight:800;letter-spacing:-.6px;margin:4px 0}
  .sc-hero .big.pos{color:var(--green)} .sc-hero .big.neg{color:var(--red)}
  .sc-hero .sub{font-size:12.5px;color:var(--muted)}
  .sc-bar{height:26px;border-radius:8px;overflow:hidden;display:flex;margin:8px 0 8px;background:#eef1f6;border:1px solid var(--line)}
  .sc-bar .seg1{background:var(--navy)}
  .sc-bar .seg2{background:var(--green)}
  .sc-bar .seg1.over{background:var(--red);width:100%}
  .sc-leg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink);margin-bottom:14px}
  .sc-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .sc-leg .tot{color:var(--muted);font-weight:700;margin-left:auto}
  .growseg{display:flex;gap:6px;margin:2px 0 10px}
  .growseg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .growseg button.on{background:var(--btl);color:#fff;border-color:var(--btl)}
  .pcbtns{display:flex;gap:16px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  .pcact{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:0}
  .pcact:active{opacity:.6}
  .pcdel{background:none;border:none;color:#b7bdc9;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-left:auto}
  .pcdel:active{color:var(--red)}
  /* collapsible group */
  .ghead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:13px 2px;font-size:14px;font-weight:700}
  .ghead .gcx{color:#aab2c0;font-weight:800;transition:transform .15s}
  .grp.open .ghead .gcx{transform:rotate(90deg)}
  .gbody{display:none} .grp.open .gbody{display:block}
  /* tooltips */
  .i{display:inline-flex;width:16px;height:16px;border-radius:50%;background:#e2e7f0;color:#556;font-size:10px;font-weight:800;align-items:center;justify-content:center;cursor:pointer;margin-left:6px;vertical-align:middle;border:none;font-style:normal}
  .i:active{background:#ccd4e0}
  .fh{font-size:11.5px;color:#57606e;background:#f4f7fb;border-radius:8px;padding:7px 10px;margin:0 0 9px;line-height:1.45}
  .scen{display:flex;justify-content:space-between;align-items:center;background:var(--amberbg);color:var(--amber);border-radius:9px;padding:7px 11px;font-size:11.5px;font-weight:800;margin-top:9px;cursor:pointer}
  /* portfolio / borrowing */
  .folio{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:14px;border-left:5px solid var(--btl)}
  .folio h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:800}
  .frow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px}
  .frow b{font-size:17px;font-weight:800;color:var(--navy)}
  .frow.net b{color:var(--green)}
  .btoggle{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin:9px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .btoggle.on{background:var(--btlbg);color:var(--btl);border-color:#bfe0d6}
  .dot2{width:34px;height:20px;border-radius:20px;background:#cfd6e0;position:relative;flex:none}
  .btoggle.on .dot2{background:var(--btl)}
  .dot2:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
  .btoggle.on .dot2:after{left:16px}
  .fsep{border-top:1px solid var(--line);margin:8px 0}
  .fnote{font-size:11px;color:var(--muted);margin-top:7px}
  .fnote a{color:var(--accent);cursor:pointer;font-weight:700}
</style>
</head>

<div class="wrap"><div id="app"></div></div>

<script>
var MEM={};var HAS_LS=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
function lsGet(k){try{return HAS_LS?localStorage.getItem(k):MEM[k];}catch(e){return MEM[k];}}
function lsSet(k,v){try{if(HAS_LS)localStorage.setItem(k,v);else MEM[k]=v;}catch(e){MEM[k]=v;}}
var KEY='pdevPro_v1';var store={deals:[],current:null};
function load(){var r=lsGet(KEY);if(r){try{store=JSON.parse(r);}catch(e){}}if(!store.deals)store.deals=[];
  if(!store.borrow)store.borrow={amount:165000,monthly:914,on:false};
  if(!store.cmpRows)store.cmpRows=['purchase','gdv','cash','headline','monthly','return','mao','score'];
  store.deals.forEach(d=>{if(!d.status)d.status='saved';});
  if(!store.deals.length){var d=defDeal();d.status='saved';store.deals.push(d);store.current=d.id;}
  if(!store.current)store.current=store.deals.length?store.deals[0].id:null;}
function save(){lsSet(KEY,JSON.stringify(store));}
function deal(){return store.deals.find(x=>x.id===store.current);}
function uid(){return 'd'+Date.now()+Math.floor(Math.random()*1000);}
function num(v){if(typeof v==='string')v=v.replace(/[£,\s]/g,'');var x=parseFloat(v);return isNaN(x)?0:x;}
function money(n){if(n===Infinity)return '∞';if(isNaN(n)||n==null)return '—';var s=Math.round(Math.abs(n)).toLocaleString('en-GB');return (n<0?'−£':'£')+s;}
function pct(n){if(isNaN(n)||!isFinite(n))return '—';return (n*100).toFixed(1)+'%';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function today(){var d=new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function mapLinkHTML(pc){pc=String(pc==null?'':pc).trim();if(!pc)return '';return '<a class="mlink" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(pc+', UK')+'" target="_blank" rel="noopener">View on Google Maps ↗</a>';}
function sdlt(p){var b=[[0,125000,.05],[125000,250000,.07],[250000,925000,.10],[925000,1500000,.15],[1500000,1e12,.17]];var t=0;for(var i=0;i<b.length;i++)t+=Math.max(0,Math.min(p,b[i][1])-b[i][0])*b[i][2];return t;}
function amortPay(P,r,n){if(P<=0)return 0;if(r<=0)return P/n;return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);}
function amortBal(P,r,n,a){if(P<=0)return 0;if(r<=0)return Math.max(0,P-(P/n)*a);var pay=amortPay(P,r,n),bal=P;for(var i=0;i<a&&i<n;i++)bal=bal*(1+r)-pay;return Math.max(0,bal);}

function calc(d,ov){ov=ov||{};
  var pp=num(d.purchasePrice)*(ov.ppMult||1),gdv=num(d.gdv)*(ov.gdvMult||1),rate=num(d.interestRate)+(ov.rateDelta||0);
  var rentM=num(d.monthlyRent)*(ov.rentMult||1),months=Math.max(0,num(d.projectMonths)+(ov.monthsDelta||0));
  var isBtl=d.mode==='btl',isCash=d.mortgageType==='cash';
  var rBase=num(d.r_kitchen)+num(d.r_bathroom)+num(d.r_electrical)+num(d.r_plumbing)+num(d.r_heating)+num(d.r_roof)+num(d.r_windows)+num(d.r_decoration)+num(d.r_flooring)+num(d.r_external)+num(d.r_garden)+num(d.r_waste)+num(d.r_professional);
  var contingency=rBase*num(d.contingencyPct)/100,refurb=(rBase+contingency)*(ov.refurbMult||1);
  var deposit=isCash?pp:pp*num(d.depositPct)/100,mortgage=isCash?0:Math.max(0,pp-deposit),ltv=pp>0?mortgage/pp:0;
  var arrange=mortgage*num(d.arrangeFeePct)/100,financeFees=arrange+num(d.brokerFee)+num(d.valuationFee),mrate=rate/100/12,monthlyPay,financeInterest;
  if(isCash){monthlyPay=0;financeInterest=0;}
  else if(d.mortgageBasis==='repayment'){var n=Math.max(1,num(d.termYears)*12);monthlyPay=amortPay(mortgage,mrate,n);var bal=amortBal(mortgage,mrate,n,Math.min(months,n));financeInterest=monthlyPay*Math.min(months,n)-(mortgage-bal);}
  else{monthlyPay=mortgage*mrate;financeInterest=monthlyPay*months;}
  var financeCosts=financeFees+financeInterest,stamp=sdlt(pp);
  var acqTotal=stamp+num(d.solicitorAcq)+num(d.searches)+num(d.survey)+num(d.landRegistry)+num(d.mortgageFeesAcq)+num(d.otherAcq);
  var holdMoNonMort=num(d.h_insurance)+num(d.h_utilities)+num(d.h_councilTax)+num(d.h_security)+num(d.h_storage)+num(d.h_site)+num(d.h_other);
  var holdTotNonMort=holdMoNonMort*months,holdMoIncl=holdMoNonMort+monthlyPay,holdTotIncl=holdMoIncl*months;
  var sellFixed=num(d.sellSolicitor)+num(d.epc)+num(d.marketing)+num(d.staging)+num(d.sellOther),sellAgent=gdv*num(d.agentPct)/100,sellTotal=sellAgent+sellFixed;
  var cashBeforeRefurb=deposit+acqTotal+financeFees,cashInvested=deposit+acqTotal+financeFees+refurb+holdTotNonMort;
  var projectCost=pp+acqTotal+refurb+financeCosts+holdTotNonMort+sellTotal,profit=gdv-projectCost;
  var roi=cashInvested>0?profit/cashInvested:0,roce=projectCost>0?profit/projectCost:0,margin=gdv>0?profit/gdv:0,profitPM=months>0?profit/months:profit;
  var breakEven=(num(d.agentPct)<100)?(pp+acqTotal+refurb+financeCosts+holdTotNonMort+sellFixed)/(1-num(d.agentPct)/100):Infinity;
  var mao=gdv-num(d.targetProfit)-refurb-sellTotal-holdTotNonMort-financeCosts-acqTotal;
  var opMonthly=rentM*(num(d.managementPct)+num(d.maintenancePct)+num(d.voidPct))/100+(num(d.rentInsurance)+num(d.gasSafety)+num(d.electricalInspection)+num(d.licensing)+num(d.groundRent)+num(d.serviceCharge)+num(d.rentOther))/12;
  var netCF=rentM-monthlyPay-opMonthly,annualCF=netCF*12,grossYield=pp>0?rentM*12/pp:0,noiAnnual=rentM*12-opMonthly*12,netYield=(pp+acqTotal+refurb)>0?noiAnnual/(pp+acqTotal+refurb):0,coc=cashInvested>0?annualCF/cashInvested:0;
  var newLoan=gdv*num(d.refiLTV)/100,refiRelease=Math.max(0,newLoan-mortgage),refiPay=newLoan*mrate,refiNetCF=rentM-refiPay-opMonthly,capitalLeftIn=Math.max(0,cashInvested-refiRelease),cocLeftIn=capitalLeftIn>0?(refiNetCF*12)/capitalLeftIn:(refiNetCF>0?Infinity:0),equityBtl=gdv-newLoan,maoBtl=num(d.targetYield)>0?rentM*12/(num(d.targetYield)/100):0;
  var equity=isBtl?equityBtl:profit,maoU=isBtl?maoBtl:mao,discount=num(d.marketValue)>0?(num(d.marketValue)-pp)/num(d.marketValue):0;
  var totalProjectCost=isBtl?(pp+acqTotal+refurb+financeCosts+holdTotNonMort):projectCost;
  return{pp,gdv,rentM,months,isBtl,isCash,deposit,mortgage,ltv,arrange,financeFees,monthlyPay,financeInterest,financeCosts,stamp,acqTotal,rBase,contingency,refurb,holdMoNonMort,holdTotNonMort,holdMoIncl,holdTotIncl,sellAgent,sellFixed,sellTotal,cashBeforeRefurb,cashInvested,projectCost,totalProjectCost,profit,roi,roce,margin,profitPM,breakEven,mao:maoU,opMonthly,netCF,annualCF,grossYield,netYield,coc,newLoan,refiRelease,refiPay,refiNetCF,capitalLeftIn,cocLeftIn,equity,discount,ppm2:num(d.floorArea)>0?pp/num(d.floorArea):0,gdvm2:num(d.floorArea)>0?gdv/num(d.floorArea):0,refurbm2:num(d.floorArea)>0?refurb/num(d.floorArea):0,refurbPctPP:pp>0?refurb/pp:0};
}

function renderDash(){
  var counts={saved:0,testing:0,archived:0};store.deals.forEach(d=>{counts[statusOf(d)]++;});
  if(counts[dashFilter]===0){dashFilter=counts.saved?'saved':counts.testing?'testing':counts.archived?'archived':'saved';}
  var list=store.deals.filter(d=>statusOf(d)===dashFilter);
  var h='<div class="appbar"><div class="ttl">Your properties<span>'+counts.saved+' saved · '+counts.testing+' in progress</span></div>'+
    '<div class="menu"><button class="ic" onclick="toggleMenu(event)">···</button><div class="menu-pop" id="menuPop"><button onclick="exportJSON()">Download backup</button><button onclick="document.getElementById(\'imp\').click()">Restore backup</button></div><input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(event)"></div></div>';
  h+='<div class="dashwrap">'+folioHTML()+'<div class="filters">'+['saved','testing','archived'].map(f=>'<button class="chip'+(dashFilter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+({saved:'Saved',testing:'In progress',archived:'Archived'}[f])+' ('+counts[f]+')</button>').join('')+'</div>';
  h+=list.length?list.map(cardHTML).join(''):'<div class="empty">No '+({saved:'saved',testing:'in-progress',archived:'archived'}[dashFilter])+' properties here yet.<br>Tap “New property” to start one.</div>';
  h+='<button class="newbtn" onclick="newDeal()">＋ New property</button>'+(store.deals.filter(d=>statusOf(d)!=='archived').length>=2?'<button class="cmpbtn" onclick="openCompare()">⇄ Compare properties</button>':'')+'</div>';
  document.getElementById('app').innerHTML=h;
}

  var big=isB?money(c.netCF)+'/mo':money(c.profit),lab=isB?'monthly cash flow':'profit';
  var meta='<span class="modetag '+d.mode+'">'+(isB?'BTL':'FLIP')+'</span> '+money(c.pp)+(isB?' · '+pct(c.grossYield)+' yield':' · GDV '+money(c.gdv));
  var arch=statusOf(d)==='archived';
  return '<div class="pcard '+d.mode+'"><div class="pctop" onclick="openDeal(\''+d.id+'\')"><div><div class="pcname">'+esc(d.name||'Untitled')+'</div><div class="pcmeta">'+meta+'</div></div>'+
    '<div class="pcright"><div class="cardtog" onclick="event.stopPropagation()"><button class="'+(!isB?'on':'')+'" onclick="cardMode(\''+d.id+'\',\'flip\',event)">Flip</button><button class="'+(isB?'on':'')+'" onclick="cardMode(\''+d.id+'\',\'btl\',event)">BTL</button></div>'+

    '<div class="pcbtns">'+(arch?'<button class="pcact" onclick="restoreCard(\''+d.id+'\',event)">＋ Add to dashboard</button>':'<button class="pcact" onclick="archiveCard(\''+d.id+'\',event)">Remove from dashboard</button>')+'<button class="pcdel" onclick="removeCard(\''+d.id+'\',event)">Delete for good</button></div></div>';
}
function archiveCard(id,e){if(e)e.stopPropagation();var d=store.deals.find(x=>x.id===id);if(!d)return;d.status='archived';save();renderDash();toast('Off the dashboard — kept under Archived');}
function restoreCard(id,e){if(e)e.stopPropagation();var d=store.deals.find(x=>x.id===id);if(!d)return;d.status='saved';save();renderDash();toast('Restored to the dashboard');}
function removeCard(id,e){if(e)e.stopPropagation();var d=store.deals.find(x=>x.id===id);if(!confirm('Delete “'+((d&&d.name)||'this property')+'” for good? This cannot be undone — use Archive to keep it.'))return;store.deals=store.deals.filter(x=>x.id!==id);if(store.current===id)store.current=store.deals.length?store.deals[0].id:null;save();renderDash();}

      : '<div class="sc-bar"><div class="seg1 over"></div></div>';
    var h='<div class="sc-hero"><div class="lab">Profit if you flip it</div><div class="big '+(profit>=0?'pos':'neg')+'">'+money(profit)+'</div><div class="sub">'+pct(c.margin)+' margin · '+pct(c.roi)+' return on your cash</div></div>';
    h+=bar+'<div class="sc-leg"><span><i style="background:var(--navy)"></i>Costs '+money(cost)+'</span><span><i style="background:var(--green)"></i>Profit '+money(profit)+(gdv>0?' ('+pct(c.margin)+')':'')+'</span><span class="tot">Sells for '+money(gdv)+'</span></div>';
    h+='<div class="kv">'+O('It costs you (all in)',money(cost),'','','Purchase + acquisition + refurbishment + finance + holding + selling.')+O('It sells for (GDV)',money(gdv))+O('Cash you tie up',money(c.cashInvested),'','','The deposit and costs you fund yourself.')+O('You keep (profit)',money(profit),profit>=0?'pos':'neg',true,'Sale price − everything it costs you.')+'</div>';
    return h;
  }
  var gp=num(d.growthPct)||5,g=gp/100,base=num(d.gdv)||num(d.marketValue)||c.pp;
  var v5=base*Math.pow(1+g,5),v10=base*Math.pow(1+g,10),gain5=v5-base,gain10=v10-base;
  var run=c.monthlyPay+c.opMonthly,totalRet10=c.netCF*120+gain10;
  var h='<div class="sc-hero"><div class="lab">You keep each month</div><div class="big '+(c.netCF>=0?'pos':'neg')+'">'+money(c.netCF)+'/mo</div><div class="sub">'+money(c.annualCF)+' a year · '+pct(c.grossYield)+' gross yield</div></div>';
  h+='<h2 class="sec">The monthly picture</h2><div class="kv">'+O('Rent it brings in',money(c.rentM)+'/mo')+O('Running costs (incl. mortgage)','−'+money(run)+'/mo','neg','','Mortgage '+money(c.monthlyPay)+' + running costs '+money(c.opMonthly)+'.')+O('You keep (net)',money(c.netCF)+'/mo',c.netCF>=0?'pos':'neg',true,'Rent − mortgage − running costs.')+O('Cash you put in',money(c.cashInvested))+'</div>';
  h+='<h2 class="sec">Do it up, let it, then refinance</h2><div class="hint">Once the works add value and it’s let, refinance at '+num(d.refiLTV)+'% of the value to pull your capital back out. Set the refinance LTV on the Finance tab.</div><div class="kv">'+O('Value after works (GDV)',money(c.gdv))+O('New mortgage at '+num(d.refiLTV)+'% LTV',money(c.newLoan),'','','Value × refinance LTV.')+O('Cash you can pull out',money(c.refiRelease),'pos',true,'New mortgage − your current mortgage.')+O('Capital left in the deal',money(c.capitalLeftIn),'','','What you spent − the cash you pull out. A good BRRR leaves little or none in.')+O('New mortgage payment',money(c.refiPay)+'/mo','neg','','Up from '+money(c.monthlyPay)+'/mo before refinancing.')+O('Net income after refinancing',money(c.refiNetCF)+'/mo',c.refiNetCF>=0?'pos':'neg',true,'Rent − the new (higher) mortgage − running costs. Check the rent still covers it.')+'</div>';
  h+='<h2 class="sec">If the property grows in value</h2><div class="hint">UK house prices have risen about 5% a year on average over the long term (ONS House Price Index). Pick a rate:</div>';
  h+='<div class="growseg">'+[3,4,5,7].map(p=>'<button class="'+(gp===p?'on':'')+'" onclick="setGrowth('+p+')">'+p+'%/yr</button>').join('')+'</div>';
  h+='<div class="kv">'+O('Value today',money(base))+O('In 5 years',money(v5)+' (+'+money(gain5)+')','pos')+O('In 10 years',money(v10)+' (+'+money(gain10)+')','pos')+O('Total return over 10 years',money(totalRet10),totalRet10>=0?'pos':'neg',true,'Rent you keep over 10 years ('+money(c.netCF*120)+') + value growth ('+money(gain10)+'). Rough guide — ignores rent rises and remortgaging.')+'</div>';
  return h;
}
function setGrowth(p){deal().growthPct=p;save();renderTab();}
var sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0},stressOn=null;
var SLIDERS=[['ppMult','Purchase price','mult',0.8,1.2,0.01],['gdvMult','End value / GDV','mult',0.8,1.2,0.01],['refurbMult','Refurbishment','mult',0.8,1.2,0.01],['rateDelta','Interest rate','pp',-5,5,0.25],['rentMult','Monthly rent','mult',0.8,1.2,0.01],['monthsDelta','Holding period','mo',-12,12,1]];
var STRESS=[['Refurb +10%',{refurbMult:1.1}],['Refurb +20%',{refurbMult:1.2}],['Interest +1%',{rateDelta:1}],['Interest +2%',{rateDelta:2}],['Sale −5%',{gdvMult:0.95}],['Sale −10%',{gdvMult:0.9}],['Rent −10%',{rentMult:0.9}],['Vacant 3 mo',{rentMult:0.75}],['Delayed 3 mo',{monthsDelta:3}]];
function riskTab(){
  return '<div class="hint">Drag to test each assumption, or tap a stress test. The summary at the top updates too.</div>'+
    '<div class="grp" id="sliders"></div>'+
    '<h2 class="sec">One-click stress tests</h2><div class="stressgrid" id="stressgrid"></div>'+
    '<div class="grp" id="sensOut"></div>'+
    '<button class="mini" onclick="resetSens()">↺ Reset to base case</button>'+
    '<h2 class="sec">Controllable vs non-controllable</h2><div id="ctrlBody"></div>';
}
function paintRisk(d){
  var sl=document.getElementById('sliders');if(!sl)return;
  sl.innerHTML=SLIDERS.map(s=>{var v=sens[s[0]];var disp=s[2]==='mult'?(Math.round((v-1)*100)+'%'):s[2]==='pp'?((v>=0?'+':'')+v+'pp'):((v>=0?'+':'')+v+' mo');
    return '<div class="slider"><div class="t"><span>'+s[1]+'</span><span class="val" id="sr-'+s[0]+'">'+disp+'</span></div><input type="range" min="'+s[3]+'" max="'+s[4]+'" step="'+s[5]+'" value="'+v+'" oninput="onSlider(\''+s[0]+'\',this.value)"></div>';}).join('');
  document.getElementById('stressgrid').innerHTML=STRESS.map((s,i)=>'<button class="stress'+(stressOn===i?' on':'')+'" onclick="applyStress('+i+')">'+s[0]+'</button>').join('');
  paintSensOut(d);paintCtrl(calc(d),d);
}
function onSlider(k,v){sens[k]=parseFloat(v);stressOn=null;var s=SLIDERS.find(x=>x[0]===k);
  var disp=s[2]==='mult'?(Math.round((sens[k]-1)*100)+'%'):s[2]==='pp'?((sens[k]>=0?'+':'')+sens[k]+'pp'):((sens[k]>=0?'+':'')+sens[k]+' mo');
  var r=document.getElementById('sr-'+k);if(r)r.textContent=disp;
  document.querySelectorAll('.stress').forEach(b=>b.classList.remove('on'));
  paintSensOut(deal());repaint();}
function applyStress(i){if(stressOn===i){resetSens();return;}stressOn=i;sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0};Object.assign(sens,STRESS[i][1]);paintRisk(deal());repaint();}
function resetSens(){sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0};stressOn=null;paintRisk(deal());repaint();}
function paintSensOut(d){var el=document.getElementById('sensOut');if(!el)return;var base=calc(d),sc=calc(d,sens),isB=base.isBtl;
  function dl(a,b,m){var diff=b-a;return '<span style="color:var(--faint);font-weight:600">('+(diff>=0?'+':'−')+(m?money(Math.abs(diff)).replace('−',''):pct(Math.abs(diff)))+')</span>';}
  var pf=isB?sc.annualCF:sc.profit,pf0=isB?base.annualCF:base.profit,rv=isB?sc.coc:sc.roi,rv0=isB?base.coc:base.roi,cfv=isB?sc.netCF:sc.profitPM;
  var sco=healthScores(sc).overall,tl=sco>=70?'green':sco>=45?'amber':'red';
  el.innerHTML=O(isB?'Annual cash flow':'Profit',money(pf)+' '+dl(pf0,pf,true),pf>=0?'pos':'neg',true)+O(isB?'Cash-on-cash':'ROI',pct(rv)+' '+dl(rv0,rv,false))+O('Monthly cash flow',money(cfv),cfv>=0?'pos':'neg')+O('Equity',money(isB?sc.equity:sc.profit))+'<div class="o big"><span>Scenario verdict</span><span class="p '+tl+'">'+(tl==='green'?'Strong':tl==='amber'?'Marginal':'Poor')+' · '+sco+'/100</span></div>';
}
function paintCtrl(c,d){var el=document.getElementById('ctrlBody');if(!el)return;var ci=[],ni=[];
  GROUPS.forEach(g=>{if(!vis(g,d.mode))return;g.fields.forEach(f=>{if(f.ctrl==null||f.type==='text'||f.type==='select')return;var val;
    if(f.k==='depositPct')val=num(d.purchasePrice)*num(d.depositPct)/100;else if(f.k==='arrangeFeePct')val=c.arrange;else if(f.k==='agentPct')val=c.sellAgent;else if(f.type==='num')return;else val=num(d[f.k]);
    (f.ctrl?ci:ni).push([f.label,val]);});});
  ni.push(['Stamp Duty',c.stamp]);var ct=ci.reduce((a,x)=>a+x[1],0),nt=ni.reduce((a,x)=>a+x[1],0),p=c.totalProjectCost||1;
  function tbl(a,tot,l){return '<table class="tbl">'+a.map(x=>'<tr><td>'+x[0]+'</td><td>'+money(x[1])+'</td></tr>').join('')+'<tr class="tot"><td>'+l+' ('+pct(tot/p)+' of cost)</td><td>'+money(tot)+'</td></tr></table>';}
  el.innerHTML='<div class="grp"><h3>You can control</h3>'+tbl(ci,ct,'Running total')+'</div><div class="grp"><h3>You cannot control</h3>'+tbl(ni,nt,'Running total')+'<div class="hint">Market interest rates, inflation, planning and tax sit behind these — the stress tests show your exposure.</div></div>';
}
function sensActive(){return sens.ppMult!==1||sens.gdvMult!==1||sens.refurbMult!==1||sens.rateDelta!==0||sens.rentMult!==1||sens.monthsDelta!==0;}
function ov(){return sensActive()?sens:{};}
function repaint(){var d=deal(),active=sensActive(),c=calc(d,ov());
  var s=healthScores(c),isB=c.isBtl,band=s.overall>=70?'green':s.overall>=45?'amber':'red';
  var big=isB?c.annualCF:c.profit,lab=isB?'Expected annual cash flow':'Expected profit';
  var sm=document.getElementById('summary');if(sm){sm.className='summary '+d.mode;
  sm.innerHTML='<div class="top"><div><div class="lab">'+lab+'</div><div class="big '+(big>=0?'pos':'neg')+'">'+money(big)+'</div></div><div style="text-align:right"><span class="modetag '+d.mode+'">'+(isB?'BUY TO LET':'FLIP')+'</span><div style="margin-top:7px"><span class="pill '+band+'">'+(band==='green'?'Strong':band==='amber'?'Marginal':'Poor')+' · '+s.overall+'</span></div></div></div>'+
    '<div class="mini">'+(isB?'Rent <b>'+money(c.rentM)+'</b> · Mortgage <b>'+money(c.monthlyPay)+'</b> · Net <b>'+money(c.netCF)+'/mo</b>':'ROI <b>'+pct(c.roi)+'</b> · Cash <b>'+money(c.cashInvested)+'</b> · Max offer <b>'+money(c.mao)+'</b>')+'</div>'+
    (active?'<div class="scen" onclick="resetSens()"><span>⚠ What-if scenario applied</span><span>Reset ✕</span></div>':'');}
  GROUPS.forEach(g=>{var el=document.getElementById('det-'+g.id);if(el)el.innerHTML=detFor(g.id,c);});
  var ml=document.getElementById('mapLink');if(ml)ml.innerHTML=mapLinkHTML(d.postcode);
  if(curTab==='summary')document.getElementById('tabc').innerHTML=summaryTab(c,d);
  if(curTab==='scorecard')document.getElementById('tabc').innerHTML=scorecardTab(c,d);
}
function upd(k,v){var d=deal();d[k]=v;save();
  if(k==='mortgageType'||k==='mortgageBasis'){renderTab();repaint();return;}
  if(curTab==='summary'){renderTab();repaint();return;}
  repaint();}
function updDep(w,val){var d=deal(),pp=num(d.purchasePrice);
  if(w==='pct'){d.depositPct=num(val);var a=document.getElementById('dAmt');if(a)a.value=Math.round(pp*num(val)/100);}
  else{d.depositPct=pp>0?num(val)/pp*100:0;var p=document.getElementById('dPct');if(p)p.value=Math.round(d.depositPct*100)/100;}
  save();repaint();}
function updNote(id,v){var d=deal();if(!d.notes)d.notes={};d.notes[id]=v;save();}
function setMode(m){var d=deal();d.mode=m;save();sens={ppMult:1,gdvMult:1,refurbMult:1,rateDelta:0,rentMult:1,monthsDelta:0};stressOn=null;render();}
function newDeal(){var n=prompt('Name this property (e.g. 12 Example Street):','');if(n===null)return;var d=defDeal();d.name=(n&&n.trim())||('Property '+(store.deals.length+1));d.address=d.name;d.status='testing';store.deals.push(d);store.current=d.id;save();curTab='purchase';view='deal';render();window.scrollTo(0,0);}
function renameDeal(){var d=deal();var n=prompt('Rename property:',d.name);if(n&&n.trim()){d.name=n.trim();save();render();}}
function delDeal(){if(!confirm('Delete this property for good?'))return;store.deals=store.deals.filter(x=>x.id!==store.current);store.current=store.deals.length?store.deals[0].id:null;save();goDash();}
function toggleMenu(e){e.stopPropagation();document.getElementById('menuPop').classList.toggle('open');}
document.addEventListener('click',()=>{var m=document.getElementById('menuPop');if(m)m.classList.remove('open');});
function exportJSON(){var b=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='propdev-appraisals.json';a.click();}
function importJSON(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.deals){store=d;if(!store.current)store.current=store.deals[0].id;save();render();}else alert('Not a valid backup.');}catch(err){alert('Could not read file.');}};r.readAsText(f);e.target.value='';}
function pdfText(s){return String(s==null?'':s).replace(/[−–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/∞/g,'inf').replace(/[▲▼·→]/g,'-').replace(/[^\x00-\xFF]/g,'?');}
function pdfEsc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]/g,' ');}
function pdfW(s,size){var W={' ':278,',':278,'.':278,'-':333,'%':889,'/':278,'£':556,':':278,'(':333,')':333};var w=0;for(var i=0;i<s.length;i++){var ch=s[i];w+=W[ch]!=null?W[ch]:(ch>='0'&&ch<='9')?556:(ch>='A'&&ch<='Z')?667:500;}return w*size/1000;}
function makePDF(fname,title,subtitle,sections){var pw=595,ph=842,mL=50,mR=545,top=800,bot=54;var pages=[],pg={t:[],r:[]},y=top;
  function flush(){pages.push(pg);pg={t:[],r:[]};y=top;}function T(x,yy,f,s,t,c){pg.t.push({x,y:yy,f,s,t:pdfText(t),c:c||[.1,.1,.1]});}function R(x1,x2,yy,c){pg.r.push({x1,x2,y:yy,c:c||[.8,.8,.8]});}function br(h){y-=(h||15);if(y<bot)flush();}
  T(mL,y,'F2',18,title,[.12,.22,.39]);br(22);T(mL,y,'F1',10,subtitle,[.42,.42,.42]);br(8);R(mL,mR,y,[.12,.22,.39]);br(18);
  sections.forEach(sec=>{if(y-34<bot)flush();T(mL,y,'F2',12,sec.h,[.12,.22,.39]);br(4);R(mL,mR,y);br(15);sec.rows.forEach(rw=>{if(y-15<bot)flush();var bold=!!rw[2],col=bold?[.12,.22,.39]:[.1,.1,.1];T(mL,y,bold?'F2':'F1',11,rw[0],col);var vs=String(rw[1]);T(mR-pdfW(pdfText(vs),11),y,'F2',11,vs,col);br(15);});br(8);});
  flush();function cs(p){var s='';p.r.forEach(r=>{s+=r.c[0]+' '+r.c[1]+' '+r.c[2]+' RG 0.7 w '+r.x1+' '+r.y+' m '+r.x2+' '+r.y+' l S\n';});s+='BT\n';p.t.forEach(t=>{s+=t.c[0]+' '+t.c[1]+' '+t.c[2]+' rg /'+t.f+' '+t.s+' Tf 1 0 0 1 '+Math.round(t.x*100)/100+' '+Math.round(t.y*100)/100+' Tm ('+pdfEsc(t.t)+') Tj\n';});s+='ET\n';return s;}
  var out='%PDF-1.4\n%âãÏÓ\n',off={},cnt=0;function add(b){cnt++;off[cnt]=out.length;out+=cnt+' 0 obj\n'+b+'\nendobj\n';}
  var kids=[];for(var i=0;i<pages.length;i++)kids.push((5+2*i)+' 0 R');
  add('<< /Type /Catalog /Pages 2 0 R >>');add('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' /MediaBox [0 0 '+pw+' '+ph+'] >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  for(i=0;i<pages.length;i++){add('<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');var c=cs(pages[i]);add('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream');}
  var xp=out.length;out+='xref\n0 '+(cnt+1)+'\n0000000000 65535 f \n';for(i=1;i<=cnt;i++)out+=('0000000000'+off[i]).slice(-10)+' 00000 n \n';out+='trailer\n<< /Size '+(cnt+1)+' /Root 1 0 R >>\nstartxref\n'+xp+'\n%%EOF';
  var by=new Uint8Array(out.length);for(i=0;i<out.length;i++)by[i]=out.charCodeAt(i)&0xFF;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([by],{type:'application/pdf'}));a.download=fname;a.click();}
function exportPDF(){var d=deal(),c=calc(d),isB=c.isBtl;
  var secs=[{h:'Headline',rows:[[isB?'Annual cash flow':'Expected profit',isB?money(c.annualCF):money(c.profit),true],['Monthly cash flow',money(isB?c.netCF:c.profitPM)],[isB?'Cash-on-cash':'ROI',pct(isB?c.coc:c.roi)],['Total cash needed',money(c.cashInvested)],['Maximum offer price',money(c.mao),true],isB?['Gross yield',pct(c.grossYield)]:['Break-even sale',money(c.breakEven)],['Deal score',healthScores(c).overall+' / 100']]},
    {h:'Purchase',rows:[['Address',d.address||'-'],['Purchase price',money(c.pp)],['Market value',money(num(d.marketValue))],['End value / GDV',money(c.gdv)],['Discount below MV',pct(c.discount)],['Floor area',num(d.floorArea)+' m2'],['£/m2 purchase',money(c.ppm2)]]},
    {h:'Finance',rows:[['Mortgage type',d.mortgageType],['Mortgage amount',money(c.mortgage)],['LTV',pct(c.ltv)],['Monthly payment',money(c.monthlyPay)],['Interest over project',money(c.financeInterest)],['Total finance costs',money(c.financeCosts),true]]},
    {h:'Acquisition',rows:[['Stamp Duty',money(c.stamp)],['Solicitor',money(num(d.solicitorAcq))],['Searches',money(num(d.searches))],['Survey',money(num(d.survey))],['Land Registry',money(num(d.landRegistry))],['Total acquisition',money(c.acqTotal),true]]},
    {h:'Refurbishment',rows:[['Subtotal',money(c.rBase)],['Contingency ('+num(d.contingencyPct)+'%)',money(c.contingency)],['Total refurbishment',money(c.refurb),true],['Cost per m2',money(c.refurbm2)],['% of purchase',pct(c.refurbPctPP)]]},
    {h:'Holding',rows:[['Monthly (incl. mortgage)',money(c.holdMoIncl)],['Duration',c.months+' months'],['Total (excl. mortgage)',money(c.holdTotNonMort),true]]}];
  if(isB)secs.push({h:'Rental',rows:[['Monthly rent',money(c.rentM)],['Operating costs / mo',money(c.opMonthly)],['Net cash flow / mo',money(c.netCF)],['Gross yield',pct(c.grossYield)],['Net yield',pct(c.netYield)],['Refinance amount',money(c.newLoan)],['Capital left in',money(c.capitalLeftIn)]]});
  else secs.push({h:'Selling',rows:[['Agent fee',money(c.sellAgent)],['Fixed selling costs',money(c.sellFixed)],['Total selling costs',money(c.sellTotal),true]]});
  secs.push({h:'Totals & returns',rows:[['Total project cost',money(c.totalProjectCost)],[isB?'Equity created':'Profit',money(c.equity),true],[isB?'Return on cash left in':'ROCE',pct(isB?c.cocLeftIn:c.roce)]]});
  makePDF((d.name||'appraisal').replace(/[^\w -]/g,'')+'.pdf',d.name||'Appraisal',(isB?'Buy-to-Let':'Flip')+' feasibility - prepared '+today(),secs);}
