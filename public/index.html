<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Deal Screener</title>
<style>
  :root{
    --ink:#182031;--muted:#6b7280;--line:#e6e9ef;--bg:#eef1f6;--card:#fff;
    --navy:#1f3864;--navy2:#2e5496;
    --green:#1f7a52;--greenbg:#e6f4ec;--red:#b23b3b;--redbg:#fbeaea;--amber:#9a6a00;--amberbg:#fdf3dd;
    --blue:#1155a8;--bluebg:#e8f0fb;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45;
    -webkit-text-size-adjust:100%;padding-bottom:calc(24px + var(--safe-bottom))}
  .appbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 8px rgba(20,30,50,.18)}
  .appbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .appbar .sub{font-size:11px;opacity:.85;margin-top:1px}
  .iconbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .menu{position:relative}
  .menu-pop{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 8px 26px rgba(20,30,50,.2);min-width:210px;overflow:hidden;display:none;z-index:60}
  .menu-pop.open{display:block}
  .menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;
    padding:13px 15px;font-size:14px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
  .menu-pop button:last-child{border-bottom:none}
  .menu-pop button:active{background:var(--bg)}
  /* top toggle */
  .topseg{position:sticky;top:53px;z-index:30;display:flex;gap:6px;background:#dde3ec;padding:7px}
  .topseg button{flex:1;border:none;background:none;padding:11px;font-size:14px;font-weight:700;color:#5b6675;border-radius:9px;cursor:pointer}
  .topseg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,30,50,.14)}
  .view{display:none;padding:14px 14px 20px;max-width:760px;margin:0 auto}
  .view.active{display:block}
  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:6px 2px 4px}
  .lead{font-size:13px;color:var(--muted);margin:0 2px 12px}
  /* income summary */
  .summary{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin-bottom:13px}
  .sumrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
  .sumrow b{font-size:18px;font-weight:800;color:var(--navy)}
  .sumrow.net b{color:var(--green)}
  .offtoggle{display:flex;align-items:center;gap:11px;padding:10px 0 4px;border-top:1px solid #f0f2f6;margin-top:6px}
  .offlab{font-size:14px;font-weight:600;flex:1}
  .offlab .hint{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .sumnote{font-size:11px;color:var(--muted);margin-top:6px}
  .switch{position:relative;display:inline-block;width:44px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .sl{position:absolute;inset:0;background:#cfd6e0;border-radius:26px;transition:.2s;cursor:pointer}
  .sl:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked+.sl{background:var(--green)}
  .switch input:checked+.sl:before{transform:translateX(18px)}
  /* deal cards */
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  .pcard:active{background:#fbfcfe}
  .pcard .addr{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
  .pcard .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .pcard .cf{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}
  .pcard .cf .big{font-size:16px;font-weight:800}
  .pcard .cf .word{font-size:10.5px;font-weight:700;margin-top:1px}
  .cardtog{display:inline-flex;background:#eef1f6;border-radius:8px;padding:2px;margin-bottom:5px}
  .cardtog button{border:none;background:none;font-size:10.5px;font-weight:700;color:var(--muted);padding:3px 9px;border-radius:6px;cursor:pointer}
  .cardtog button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(20,30,50,.12)}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
  .dot.green,.word.green,.big.green{color:var(--green)} .dot.green{background:var(--green)}
  .dot.amber,.word.amber,.big.amber{color:var(--amber)} .dot.amber{background:var(--amber)}
  .dot.red,.word.red,.big.red{color:var(--red)} .dot.red{background:var(--red)}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;vertical-align:middle}
  .pill.saved{background:var(--greenbg);color:var(--green)}
  .pill.testing{background:var(--bluebg);color:var(--blue)}
  .pill.archived{background:#eceff3;color:#8a93a1}
  .addbtn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:14px;padding:15px;
    font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;box-shadow:0 3px 10px rgba(31,56,100,.28)}
  .addbtn:active{transform:scale(.99)}
  .empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px}
  /* sheet */
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;display:none;
    -webkit-overflow-scrolling:touch;padding-bottom:calc(30px + var(--safe-bottom))}
  .sheet.open{display:block}
  .sheet-bar{position:sticky;top:0;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
    padding:13px 14px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .sheet-bar .t{font-size:16px;font-weight:700}
  .sheet-body{max-width:760px;margin:0 auto;padding:14px}
  /* verdict banner */
  .banner{border-radius:16px;padding:16px 16px 15px;margin-bottom:14px;border:1px solid transparent}
  .banner.v-green{background:var(--greenbg);border-color:#bfe3cd}
  .banner.v-amber{background:var(--amberbg);border-color:#eddba6}
  .banner.v-red{background:var(--redbg);border-color:#f0c9c9}
  .banner .bword{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .banner.v-green .bword{color:var(--green)} .banner.v-amber .bword{color:var(--amber)} .banner.v-red .bword{color:var(--red)}
  .banner .bbig{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px}
  .banner.v-green .bbig{color:var(--green)} .banner.v-amber .bbig{color:#7a5400} .banner.v-red .bbig{color:var(--red)}
  .banner .bsub{font-size:12.5px;color:var(--muted);font-weight:600}
  .bico{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .banner.v-green .bico{background:var(--green)} .banner.v-amber .bico{background:var(--amber)} .banner.v-red .bico{background:var(--red)}
  /* groups + inputs */
  .grp{background:#fff;border:1px solid var(--line);border-radius:15px;padding:6px 14px;margin-bottom:12px}
  .grp h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 6px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f2f6;gap:10px}
  .row:last-child{border-bottom:none}
  .row label{font-size:14px;color:var(--ink);flex:1}
  .row .hint{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .inp{width:130px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:11px;
    font-size:16px;font-variant-numeric:tabular-nums;background:#fbfcfe;color:var(--navy);font-weight:700}
  .inp:focus{outline:none;border-color:var(--navy2);background:#fff}
  .inp.text{width:180px;text-align:left;font-weight:600;color:var(--ink)}
  .affix{display:flex;align-items:center;gap:4px}
  .affix .u{font-size:13px;color:var(--muted);font-weight:600}
  .maplink{font-size:13px;font-weight:700;color:var(--blue);text-decoration:none;white-space:nowrap}
  .maplink:active{opacity:.6}
  /* mode segment */
  .seg{display:flex;background:#eef1f6;border-radius:11px;padding:3px;margin:2px 0 12px}
  .seg button{flex:1;border:none;background:none;padding:10px;font-size:13px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,30,50,.12)}
  /* expanders */
  .exphead{width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;
    font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .exphead .car{color:#9aa3b2;font-weight:800;transition:transform .15s}
  .exphead.open{border-radius:13px 13px 0 0;margin-bottom:0}
  .exphead.open .car{transform:rotate(90deg)}
  .exp{display:none;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 13px 13px;padding:2px 14px;margin-bottom:12px}
  .exp.open{display:block}
  .out{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f2f6}
  .out:last-child{border-bottom:none}
  .out .lab{font-size:13.5px;color:var(--ink)}
  .out .val{font-size:14px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  /* renovation budget */
  .renointro{font-size:13px;color:var(--muted);padding:8px 0 2px}
  .ministart{margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:11px;padding:12px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
  .renototal{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid #eef1f6}
  .renototal b{font-size:19px;color:var(--navy)}
  .renosec{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:14px 0 4px}
  .renorow{display:flex;align-items:center;gap:6px;padding:4px 0}
  .renorow .renoname{flex:1;min-width:0;width:auto;text-align:left;font-weight:600;color:var(--ink);padding:10px}
  .renorow .renocost{width:92px;padding:10px}
  .renodel{border:none;background:#f3f4f7;color:#9aa3b2;border-radius:8px;width:32px;height:38px;font-size:13px;cursor:pointer;flex:none}
  .miniadd{background:none;border:1px dashed var(--line);color:var(--navy);border-radius:11px;padding:10px;font-size:12.5px;font-weight:700;cursor:pointer;width:100%;margin-top:6px}
  .renocheck{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:14px;border-bottom:1px solid #f7f8fa}
  .renocheck:last-child{border-bottom:none}
  .renocheck input{width:21px;height:21px;flex:none}
  .miniclear{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;margin:14px 0 4px;padding:6px 0}
  /* actions */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .btn{border:none;border-radius:13px;padding:14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.save{background:var(--green);color:#fff;grid-column:1/-1}
  .btn.pdf{background:var(--navy);color:#fff}
  .btn.arch{background:#eceff3;color:#4b5563}
  .btn.del{background:var(--redbg);color:var(--red)}
  .btn:active{transform:scale(.99)}
  .statusline{font-size:12px;color:var(--muted);margin:2px 2px 10px}
  .note{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
</style>
</head>
<body>

<div class="appbar">
  <div>
    <h1>Deal Screener</h1>
    <div class="sub" id="barSub">&nbsp;</div>
  </div>
  <div class="menu">
    <button class="iconbtn" onclick="toggleMenu(event)">⋯ Menu</button>
    <div class="menu-pop" id="menuPop">
      <button onclick="openTargets()">🎯 My targets & borrowing</button>
      <button onclick="exportData()">⬇︎ Export backup</button>
      <button onclick="document.getElementById('importFile').click()">⬆︎ Import backup</button>
      <button onclick="seedDemo()">✦ Load example deals</button>
      <button onclick="wipeAll()">🗑 Clear everything</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
  </div>
</div>

<!-- FRONT-SCREEN TOGGLE -->
<div class="topseg">
  <button class="on" id="seg-rentals" onclick="showTab('rentals')">Buy-to-Let</button>
  <button id="seg-flips" onclick="showTab('flips')">Flip</button>
</div>

<!-- RENTALS -->
<div class="view active" id="view-rentals">
  <p class="lead">Will the rent cover the mortgage and leave a profit?</p>
  <div id="rentList"></div>
  <button class="addbtn" onclick="newProperty()">＋ New rental to screen</button>
</div>

<!-- FLIPS -->
<div class="view" id="view-flips">
  <p class="lead">What's the profit, and could I lose money?</p>
  <div id="flipList"></div>
  <button class="addbtn" onclick="newFlip()">＋ New flip to screen</button>
</div>

<!-- RENTAL SHEET -->
<div class="sheet" id="propSheet">
  <div class="sheet-bar">
    <button class="iconbtn" onclick="closeSheet('propSheet')">‹ Back</button>
    <span class="t" id="propSheetTitle">Rental</span>
    <span style="width:64px"></span>
  </div>
  <div class="sheet-body" id="propSheetBody"></div>
</div>

<!-- FLIP SHEET -->
<div class="sheet" id="flipSheet">
  <div class="sheet-bar">
    <button class="iconbtn" onclick="closeSheet('flipSheet')">‹ Back</button>
    <span class="t" id="flipSheetTitle">Flip</span>
    <span style="width:64px"></span>
  </div>
  <div class="sheet-body" id="flipSheetBody"></div>
</div>

<!-- TARGETS SHEET -->
<div class="sheet" id="targetsSheet">
  <div class="sheet-bar">
    <button class="iconbtn" onclick="closeSheet('targetsSheet')">‹ Back</button>
    <span class="t">My targets & borrowing</span>
    <span style="width:64px"></span>
  </div>
  <div class="sheet-body" id="targetsBody"></div>
</div>

<script>
/* ---------- storage ---------- */
var MEM={};
var HAS_LS=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
function lsGet(k){try{return HAS_LS?localStorage.getItem(k):MEM[k];}catch(e){return MEM[k];}}
function lsSet(k,v){try{if(HAS_LS)localStorage.setItem(k,v);else MEM[k]=v;}catch(e){MEM[k]=v;}}

/* ---------- state (shares data with the full app) ---------- */
var STORE_KEY='propDash_v1';
var state={properties:[],flips:[],rules:{}};
function load(){var raw=lsGet(STORE_KEY);if(raw){try{state=JSON.parse(raw);}catch(e){}}
  if(!state.properties)state.properties=[];if(!state.flips)state.flips=[];
  if(!state.rules)state.rules={};
  var r=state.rules;
  if(r.flipProfit==null)r.flipProfit=20000;
  if(r.stressPP==null)r.stressPP=2;
  if(r.borrowAmount==null)r.borrowAmount=165000;
  if(r.borrowMonthly==null)r.borrowMonthly=914;
  if(r.offsetOn==null)r.offsetOn=false;}
function save(){lsSet(STORE_KEY,JSON.stringify(state));}
function uid(){return 'id'+Date.now()+Math.floor(Math.random()*1000);}

/* ---------- helpers ---------- */
function fmt(n){if(n===Infinity)return '∞';if(isNaN(n)||n===null)return '—';
  var s=Math.round(Math.abs(n)).toLocaleString('en-GB');return (n<0?'−£':'£')+s;}
function pct(n){if(isNaN(n)||!isFinite(n))return '—';return (n*100).toFixed(1)+'%';}
function num(v){if(typeof v==='string')v=v.replace(/[£,\s]/g,'');var x=parseFloat(v);return isNaN(x)?0:x;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function today(){var d=new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function weekly(mo){return mo*12/52;}

function sdlt(price){
  var b=[[0,125000,.05],[125000,250000,.07],[250000,925000,.10],[925000,1500000,.15],[1500000,1e12,.17]];
  var t=0;for(var i=0;i<b.length;i++){t+=Math.max(0,Math.min(price,b[i][1])-b[i][0])*b[i][2];}return t;}

/* ---------- rental defaults & calc ---------- */
function defProp(){return{id:uid(),status:'testing',address:'New rental',postcode:'',mapUrl:'',
  price:190000,refurb:12000,valueAfter:215000,rent:1200,depositPct:25,rate:5.25,
  running:150,feePct:2,legals:2500,mode:'btl',refiLTV:75,refiCosts:2000};}

function calcProp(p,stressPP){
  var price=num(p.price),depPct=num(p.depositPct)/100,rate=num(p.rate)/100;
  var deposit=price*depPct, loan=price-deposit;
  var stampDuty=sdlt(price);
  var fee=loan*(num(p.feePct)/100);
  var refurb=num(p.refurb), legals=num(p.legals);
  var cashIn=deposit+stampDuty+refurb+legals+fee;
  var interestMo=loan*rate/12;
  var rent=num(p.rent), running=num(p.running);
  var annualRent=rent*12;
  var grossYield=price?annualRent/price:0;
  var cfMo=rent-interestMo-running;
  var valueAfter=num(p.valueAfter), refiLTV=num(p.refiLTV)/100;
  var newLoan=valueAfter*refiLTV;
  var refiCosts=num(p.refiCosts);
  var released=Math.max(0,newLoan-loan);
  var cashLeftIn=Math.max(0,cashIn+refiCosts-released);
  var refiInterestMo=newLoan*rate/12;
  var refiCfMo=rent-refiInterestMo-running;
  var rateS=rate+num(stressPP)/100;
  var cfMoS=rent-(loan*rateS/12)-running;
  var refiCfMoS=rent-(newLoan*rateS/12)-running;
  var isBrrr=p.mode==='brrr';
  var equity=valueAfter-(isBrrr?newLoan:loan);
  var cashBasis=isBrrr?cashLeftIn:cashIn;
  var cfNow=isBrrr?refiCfMo:cfMo;
  var cfStressed=isBrrr?refiCfMoS:cfMoS;
  var coc=cashBasis>0?(cfNow*12)/cashBasis:Infinity;
  return{price:price,deposit:deposit,loan:loan,stampDuty:stampDuty,fee:fee,refurb:refurb,legals:legals,
    cashIn:cashIn,interestMo:interestMo,rent:rent,running:running,annualRent:annualRent,grossYield:grossYield,
    cfMo:cfMo,valueAfter:valueAfter,newLoan:newLoan,released:released,refiCosts:refiCosts,cashLeftIn:cashLeftIn,
    refiInterestMo:refiInterestMo,refiCfMo:refiCfMo,cfStressed:cfStressed,isBrrr:isBrrr,equity:equity,
    cashBasis:cashBasis,cfNow:cfNow,coc:coc};}

/* ---------- flip defaults & calc ---------- */
function defFlip(){return{id:uid(),status:'testing',address:'New flip',postcode:'',mapUrl:'',
  price:215000,refurb:20000,sale:260000,depositPct:37,bridgeRate:0.75,bridgeFeePct:2,
  months:6,agentPct:1.5,saleLegal:1200,buyLegal:2400,holding:1500};}

function calcFlip(f){
  var price=num(f.price),depPct=num(f.depositPct)/100;
  var deposit=price*depPct, loan=price-deposit;
  var stampDuty=sdlt(price);
  var bridgeFee=loan*(num(f.bridgeFeePct)/100);
  var months=num(f.months);
  var bridgeInt=loan*(num(f.bridgeRate)/100)*months;
  var finance=bridgeFee+bridgeInt;
  var sale=num(f.sale);
  var selling=sale*(num(f.agentPct)/100)+num(f.saleLegal);
  var refurb=num(f.refurb),buyLegal=num(f.buyLegal),holding=num(f.holding);
  var totalCost=price+refurb+stampDuty+buyLegal+finance+selling+holding;
  var profit=sale-totalCost;
  var margin=sale?profit/sale:0;
  var cashIn=deposit+stampDuty+refurb+buyLegal+bridgeFee+holding;
  var roi=cashIn>0?profit/cashIn:0;
  var roiAnnual=months>0?roi*12/months:roi;
  var fixedCosts=price+refurb+stampDuty+buyLegal+finance+holding+num(f.saleLegal);
  var agentFrac=num(f.agentPct)/100;
  var breakeven=agentFrac<1?fixedCosts/(1-agentFrac):Infinity;
  return{price:price,deposit:deposit,loan:loan,stampDuty:stampDuty,bridgeFee:bridgeFee,bridgeInt:bridgeInt,
    finance:finance,sale:sale,selling:selling,refurb:refurb,buyLegal:buyLegal,holding:holding,

/* ---------- verdicts ---------- */
function rentVerdict(p){
  var c=calcProp(p);var pp=num(state.rules.stressPP);var s=calcProp(p,pp).cfStressed;
  if(c.cfNow<0)return{band:'red',ico:'✕',word:'Doesn’t stack up',big:fmt(c.cfNow)+'/mo',sub:'Losing '+fmt(-c.cfNow)+' a month at today’s rate'};
  if(s<0)return{band:'amber',ico:'!',word:'Tight',big:fmt(c.cfNow)+'/mo',sub:'Turns to '+fmt(s)+'/mo if rates rise '+pp+'%'};
  return{band:'green',ico:'✓',word:'Stacks up',big:fmt(c.cfNow)+'/mo',sub:'Still '+fmt(s)+'/mo after a '+pp+'% rate rise'};
}
function flipVerdict(f){
  var c=calcFlip(f);var t=num(state.rules.flipProfit);
  if(c.profit<0)return{band:'red',ico:'✕',word:'Doesn’t stack up',big:fmt(c.profit),sub:'You’d lose '+fmt(-c.profit)};
  if(c.profit<t)return{band:'amber',ico:'!',word:'Tight',big:fmt(c.profit),sub:'Under your '+fmt(t)+' target · '+pct(c.roi)+' return'};
  return{band:'green',ico:'✓',word:'Stacks up',big:fmt(c.profit),sub:'Beats your '+fmt(t)+' target · '+pct(c.roi)+' return'};
}
function bannerHTML(v){
  return '<div class="banner v-'+v.band+'"><div class="bword"><span class="bico">'+v.ico+'</span>'+v.word+'</div>'+
    '<div class="bbig">'+v.big+'</div><div class="bsub">'+v.sub+'</div></div>';
}

/* ---------- renovation & legal-to-rent budget (per property) ---------- */
var RENO_WORKS=['Kitchen','Bathroom','Rewire / electrics','Boiler / heating','Plastering','Flooring & carpets','Decorating & paint','Windows & doors','Damp / structural','Roof / guttering','Garden / external','Skip & clearance','Contingency'];
var RENO_CERTS=[{n:'EPC (needs min rating E)',c:70},{n:'Gas Safety cert (CP12)',c:80},{n:'EICR electrical report (5-yearly)',c:180},{n:'Smoke alarms (one per floor)',c:45},{n:'Carbon monoxide alarms',c:30},{n:'Legionella risk assessment',c:60}];
var RENO_CHECKS=['Right to Rent check done','Deposit protected in a scheme','“How to Rent” guide given to tenant','Landlord insurance in place','HMO / selective licence checked','Tenancy agreement (AST) signed'];
function hasReno(p){return !!(p.reno&&p.reno.length);}
function renoTotal(p){var t=0;if(p.reno)p.reno.forEach(function(i){t+=num(i.c);});if(p.legalCost)p.legalCost.forEach(function(i){t+=num(i.c);});return t;}
function syncRefurb(p){p.refurb=renoTotal(p);}
function startReno(id){var p=findProp(id);if(!p)return;
  if(!p.reno)p.reno=RENO_WORKS.map(function(n){return{n:n,c:0};});
  if(!p.legalCost)p.legalCost=RENO_CERTS.map(function(x){return{n:x.n,c:x.c};});
  if(!p.legalCheck)p.legalCheck=RENO_CHECKS.map(function(n){return{n:n,done:false};});
  syncRefurb(p);save();renderPropEditor(p);openExpTo('propRenoHead','propReno');}
function clearReno(id){var p=findProp(id);if(!confirm('Remove the renovation breakdown? Your refurb figure stays at the current total, and you can type it directly again.'))return;
  delete p.reno;delete p.legalCost;delete p.legalCheck;save();renderPropEditor(p);}
function renoLine(id,which,i,it){
  return '<div class="renorow">'+
    '<input class="inp text renoname" type="text" autocomplete="off" value="'+esc(it.n)+'" oninput="updRenoName(\''+id+'\',\''+which+'\','+i+',this.value)">'+
    '<span class="u">£</span><input class="inp renocost" type="text" inputmode="decimal" autocomplete="off" value="'+esc(it.c)+'" oninput="updRenoCost(\''+id+'\',\''+which+'\','+i+',this.value)">'+
    '<button class="renodel" onclick="removeReno(\''+id+'\',\''+which+'\','+i+')">✕</button>'+
    '</div>';
}
function propRenoInner(p){
  if(!hasReno(p)){
    return '<div class="renointro">Break your refurb into line items and tick off what makes it legal to rent — the total becomes your refurb budget.'+
      '<br><button class="ministart" onclick="startReno(\''+p.id+'\')">Start a renovation budget</button></div>';
  }
  var h='<div class="renototal"><span>Refurb budget total</span><b id="renoTotVal">'+fmt(renoTotal(p))+'</b></div>';
  h+='<div class="renosec">Renovation works</div>';
  p.reno.forEach(function(it,i){h+=renoLine(p.id,'work',i,it);});
  h+='<button class="miniadd" onclick="addReno(\''+p.id+'\',\'work\')">＋ Add a work item</button>';
  h+='<div class="renosec">Certificates &amp; safety (to let legally)</div>';
  p.legalCost.forEach(function(it,i){h+=renoLine(p.id,'cert',i,it);});
  h+='<button class="miniadd" onclick="addReno(\''+p.id+'\',\'cert\')">＋ Add a certificate / cost</button>';
  h+='<div class="renosec">Legal checklist (no cost)</div>';
  p.legalCheck.forEach(function(it,i){h+='<label class="renocheck"><input type="checkbox" '+(it.done?'checked':'')+' onchange="toggleCheck(\''+p.id+'\','+i+',this.checked)"><span>'+esc(it.n)+'</span></label>';});
  h+='<div><button class="miniclear" onclick="clearReno(\''+p.id+'\')">Remove breakdown</button></div>';
  return h;
}
function reflectRefurb(p){
  var tv=document.getElementById('renoTotVal');if(tv)tv.textContent=fmt(renoTotal(p));
  var rf=document.getElementById('refurbShown');if(rf)rf.textContent=fmt(num(p.refurb));
  var vd=document.getElementById('propVerdict');if(vd)vd.innerHTML=bannerHTML(rentVerdict(p));
  var fi=document.getElementById('propFigInner');if(fi)fi.innerHTML=propFigures(p);
}
function updRenoCost(id,which,idx,val){var p=findProp(id);if(!p)return;var arr=which==='work'?p.reno:p.legalCost;
  if(!arr||!arr[idx])return;arr[idx].c=num(val);syncRefurb(p);save();reflectRefurb(p);}
function updRenoName(id,which,idx,val){var p=findProp(id);if(!p)return;var arr=which==='work'?p.reno:p.legalCost;if(arr&&arr[idx]){arr[idx].n=val;save();}}
function addReno(id,which){var p=findProp(id);var arr=which==='work'?p.reno:p.legalCost;arr.push({n:'',c:0});save();rerenderReno(p);}
function removeReno(id,which,idx){var p=findProp(id);var arr=which==='work'?p.reno:p.legalCost;arr.splice(idx,1);syncRefurb(p);save();rerenderReno(p);}
function toggleCheck(id,idx,on){var p=findProp(id);if(p.legalCheck&&p.legalCheck[idx]){p.legalCheck[idx].done=!!on;save();}}
function rerenderReno(p){var b=document.getElementById('propReno');if(b)b.innerHTML=propRenoInner(p);reflectRefurb(p);}

/* ================= real PDF generator (no library, works offline) ================= */
function pdfText(s){return String(s==null?'':s)
  .replace(/[−]/g,'-').replace(/[–—]/g,'-')
  .replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
  .replace(/∞/g,'infinite').replace(/→/g,'->').replace(/–/g,'-')
  .replace(/[^\x00-\xFF]/g,'?');}
function pdfEsc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]/g,' ');}
function pdfWidth(s,size){
  var W={' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,')':333,'*':389,'+':584,',':278,'-':333,'.':278,'/':278,':':278,';':278,'<':584,'=':584,'>':584,'?':556,'@':1015,'·':278};
  var w=0;for(var i=0;i<s.length;i++){var ch=s[i];var code=s.charCodeAt(i);var wd;
    if(W[ch]!=null)wd=W[ch];
    else if(ch>='0'&&ch<='9')wd=556;
    else if(ch>='A'&&ch<='Z')wd=('IJ').indexOf(ch)>=0?278:('MW').indexOf(ch)>=0?833:667;
    else if(ch>='a'&&ch<='z')wd=('ilj').indexOf(ch)>=0?222:('mw').indexOf(ch)>=0?833:('ft').indexOf(ch)>=0?278:500;
    else if(code===0xA3)wd=556;
    else wd=556;
    w+=wd;}
  return w*size/1000;}
function r2(x){return Math.round(x*100)/100;}
function makePDF(fname,title,subtitle,sections,footer){
  var pageW=595,pageH=842,mL=50,mR=545,top=800,bottom=54;
  var NAVY=[0.12,0.22,0.39],GREY=[0.42,0.42,0.42],INK=[0.1,0.1,0.1],RULE=[0.8,0.8,0.8];
  var pages=[],page={texts:[],rules:[]},y=top;
  function flush(){pages.push(page);page={texts:[],rules:[]};y=top;}
  function br(h){y-=(h||15);if(y<bottom){flush();}}
  function T(x,yy,f,s,t,c){page.texts.push({x:x,y:yy,f:f,s:s,t:pdfText(t),c:c||INK});}
  function R(x1,x2,yy,c){page.rules.push({x1:x1,x2:x2,y:yy,c:c||RULE});}
  T(mL,y,'F2',18,title,NAVY);br(22);
  T(mL,y,'F1',10,subtitle,GREY);br(8);
  R(mL,mR,y,NAVY);br(18);
  sections.forEach(function(sec){
    if(y-34<bottom)flush();
    T(mL,y,'F2',12,sec.h,NAVY);br(4);R(mL,mR,y,RULE);br(15);
    sec.rows.forEach(function(rw){
      if(y-15<bottom)flush();
      var bold=!!rw[2];var col=bold?NAVY:INK;
      T(mL,y,bold?'F2':'F1',11,rw[0],col);
      var vs=String(rw[1]);var vx=mR-pdfWidth(pdfText(vs),11);
      T(vx,y,'F2',11,vs,col);br(15);
    });
    br(8);
  });
  if(footer){
    if(y-30<bottom)flush();
    R(mL,mR,y,RULE);br(12);
    var words=footer.split(' '),cur='',lines=[];
    words.forEach(function(w){var tst=cur?cur+' '+w:w;if(pdfWidth(pdfText(tst),9)>(mR-mL)&&cur){lines.push(cur);cur=w;}else cur=tst;});
    if(cur)lines.push(cur);
    lines.forEach(function(ln){if(y-11<bottom)flush();T(mL,y,'F1',9,ln,GREY);br(11);});
  }
  flush();
  // assemble
  function contentStream(pg){
    var s='';
    pg.rules.forEach(function(r){s+=r.c[0]+' '+r.c[1]+' '+r.c[2]+' RG 0.7 w '+r2(r.x1)+' '+r2(r.y)+' m '+r2(r.x2)+' '+r2(r.y)+' l S\n';});
    s+='BT\n';
    pg.texts.forEach(function(t){s+=t.c[0]+' '+t.c[1]+' '+t.c[2]+' rg /'+t.f+' '+t.s+' Tf 1 0 0 1 '+r2(t.x)+' '+r2(t.y)+' Tm ('+pdfEsc(t.t)+') Tj\n';});
    s+='ET\n';return s;}
  var nPages=pages.length;
  var out='%PDF-1.4\n%âãÏÓ\n';
  var offsets={};var count=0;
  function addObj(body){count++;offsets[count]=out.length;out+=count+' 0 obj\n'+body+'\nendobj\n';}
  var kids=[];for(var i=0;i<nPages;i++)kids.push((5+2*i)+' 0 R');
  addObj('<< /Type /Catalog /Pages 2 0 R >>');
  addObj('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+nPages+' /MediaBox [0 0 '+pageW+' '+pageH+'] >>');
  addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  for(i=0;i<nPages;i++){
    addObj('<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');
    var cs=contentStream(pages[i]);
    addObj('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  }
  var xrefPos=out.length;
  out+='xref\n0 '+(count+1)+'\n0000000000 65535 f \n';
  for(i=1;i<=count;i++){out+=('0000000000'+offsets[i]).slice(-10)+' 00000 n \n';}
  out+='trailer\n<< /Size '+(count+1)+' /Root 1 0 R >>\nstartxref\n'+xrefPos+'\n%%EOF';
  var bytes=new Uint8Array(out.length);
  for(i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&0xFF;
  var blob=new Blob([bytes],{type:'application/pdf'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},1500);
}
function safeName(s){return (String(s||'deal').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'deal');}
function pdfProp(id){var p=state.properties.find(function(x){return x.id===id;});if(!p)return;
  var c=calcProp(p),cS=calcProp(p,2),v=rentVerdict(p);
  var fin=[['Mortgage loan',fmt(c.loan)],['Monthly interest',fmt(c.interestMo)]];
  if(c.isBrrr)fin=fin.concat([['New loan on refinance',fmt(c.newLoan)],['Cash released (gross)',fmt(c.released)],['Refinance costs',fmt(c.refiCosts)],['Cash left in deal',fmt(c.cashLeftIn)],['Post-refi interest / mo',fmt(c.refiInterestMo)]]);
  var sections=[
    {h:'The verdict',rows:[
      ['Monthly cash flow',fmt(c.cfNow)],['Weekly cash flow',fmt(weekly(c.cfNow))],['Annual cash flow',fmt(c.cfNow*12)],
      ['Cash flow if rate +2%',fmt(cS.cfStressed)],['Gross yield',pct(c.grossYield)],
      [c.isBrrr?'Return on cash left in':'Cash-on-cash return',isFinite(c.coc)?pct(c.coc):'All cash out'],
      [c.isBrrr?'Cash left in deal':'Total cash invested',fmt(c.cashBasis)],['Your equity',fmt(c.equity),true]]},
    {h:'The deal',rows:[
      ['Postcode',p.postcode||'-'],['Purchase price',fmt(c.price)],['Refurb budget',fmt(c.refurb)],
      ['Value after refurb',fmt(c.valueAfter)],['Monthly rent',fmt(c.rent)]]},
    {h:'Costs to acquire',rows:[
      ['Deposit',fmt(c.deposit)],['Stamp Duty (additional property)',fmt(c.stampDuty)],['Arrangement fee',fmt(c.fee)],
      ['Legal & buying costs',fmt(c.legals)],['Total cash in',fmt(c.cashIn),true]]},
    {h:'Financing',rows:fin}
  ];
  var sub=(c.isBrrr?'Buy-Refurb-Rent-Refinance (BRRR)':'Buy-to-Let')+' appraisal  -  '+v.word+'  -  prepared '+today();
  var foot='Illustrative planning figures only - not financial advice. Confirm financing with a broker and tax with an accountant. Stamp Duty shown at additional-property rates (incl. 5% surcharge).';
  makePDF(safeName(p.address)+'.pdf',p.address||'Rental',sub,sections,foot);
}
function pdfFlip(id){var f=state.flips.find(function(x){return x.id===id;});if(!f)return;
  var c=calcFlip(f),v=flipVerdict(f);
  var sections=[
    {h:'The verdict',rows:[
      ['Pre-tax profit',fmt(c.profit)],['Profit margin (on sale)',pct(c.margin)],['Return on cash in',pct(c.roi)],
      ['Return annualised',pct(c.roiAnnual)],['Cash needed',fmt(c.cashIn)],['Break-even sale price',fmt(c.breakeven),true]]},
    {h:'The project',rows:[
      ['Postcode',f.postcode||'-'],['Purchase price',fmt(c.price)],['Refurb budget',fmt(c.refurb)],['Sale price (GDV)',fmt(c.sale)]]},
    {h:'Costs',rows:[
      ['Stamp Duty (additional)',fmt(c.stampDuty)],['Bridging fee',fmt(c.bridgeFee)],['Bridging interest',fmt(c.bridgeInt)],
      ['Selling costs',fmt(c.selling)],['Legal on purchase',fmt(c.buyLegal)],['Holding costs',fmt(c.holding)],
      ['Total project cost',fmt(c.totalCost),true]]}
  ];
  var sub='Flip / refurb-resell appraisal  -  '+v.word+'  -  prepared '+today();
  var foot='Illustrative planning figures only - not financial advice. Flip profit is usually taxed as income. Confirm with a broker and accountant.';
  makePDF(safeName(f.address)+'.pdf',f.address||'Flip',sub,sections,foot);
}

function toast(msg){var t=document.createElement('div');t.textContent=msg;
  t.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#182031;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  document.body.appendChild(t);setTimeout(function(){t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(function(){t.remove();},400);},1400);}

  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='property-dashboard-backup.json';a.click();toast('Backup downloaded');}
function importData(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(d.properties||d.flips){state=d;load();save();renderRentals();renderFlips();toast('Backup imported ✓');}else{alert('Not a valid backup file.');}}catch(err){alert('Could not read that file.');}};
  r.readAsText(file);e.target.value='';}
